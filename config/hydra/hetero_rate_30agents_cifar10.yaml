defaults:
  - dataset: hetero_cifar10
  - model: hetero_cnn_classifier
  - orchestrator: non_cooperative
  - optimizer: sgd
  - _self_

seed: 42
study_name: "HeteroRate CIFAR10 30agents"

# All agents use full-width architecture by default (rate=1.0).
# Override individual rates to reintroduce architectural heterogeneity, e.g.:
#   --multirun 'agents.10.rate=0.5,agents.20.rate=0.25'
agents:
  0:  {rate: 1.0}
  1:  {rate: 1.0}
  2:  {rate: 1.0}
  3:  {rate: 1.0}
  4:  {rate: 1.0}
  5:  {rate: 1.0}
  6:  {rate: 1.0}
  7:  {rate: 1.0}
  8:  {rate: 1.0}
  9:  {rate: 1.0}
  10: {rate: 1.0}
  11: {rate: 1.0}
  12: {rate: 1.0}
  13: {rate: 1.0}
  14: {rate: 1.0}

graph:
  neighbors_mode: "fully_connected"
  seed: 42
  p: 0.15
  m: 3
  neighbors: {}

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: sheaf-repr-learning__hetero-rate-30agents
  group: ${study_name}
  name: ${hydra:runtime.choices.orchestrator}_trial_${hydra:job.num}
  save_dir: logs/
  log_model: false

trainer:
  max_epochs: 25
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 25

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step

  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: validation/avg_task_performance_epoch
    mode: max
    save_top_k: 1
    save_last: true

  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: validation/avg_task_performance_epoch
    patience: 5
    mode: max

dataset:
  split_strategy: grouped_non_iid
  n_agents: 15
  classes_per_agent: 10   # set < 10 to restrict which classes every agent sees
  shift_strength: 0.8     # 0.0 = uniform, 1.0 = fully on target_classes
  monitor_test_during_fit: true
  batch_size: 256
  num_workers: 0
  mode: min_size
  pilot_split: 0.05
  pilot_batch_size: 64
  comm_data: private_pilots  # per-agent filtered pilots (handles distribution shift)
  groups:
    0:
      agents: [0, 1, 2, 3, 4]
      target_classes: [0, 1, 2, 3, 4, 5]  # intersects group 1 on {2,3,4,5}, group 2 on {4,5}
    1:
      agents: [5, 6, 7, 8, 9]
      target_classes: [2, 3, 4, 5, 6, 7]  # intersects group 0 on {2,3,4,5}, group 2 on {4,5,6,7}
    2:
      agents: [10, 11, 12, 13, 14]
      target_classes: [4, 5, 6, 7, 8, 9]  # intersects group 0 on {4,5}, group 1 on {4,5,6,7}

model:
  encoder_hidden_dims: [32, 64, 128]
  decoder_hidden_dims: [256]
  dropout: 0.1
  use_batchnorm: true

orchestrator:
  # sheaf_frl defaults (active when orchestrator=sheaf_frl)
  lambda_sheaf: 0.05
  parseval_normalization: false
  l2_normalization: false
  filter_unseen_classes: true
  use_prototypes: true
  # sheaf_fmtl defaults (active when orchestrator=sheaf_fmtl)
  gamma: 0.001
  lambda_reg: 0.001
  eta: 0.01

optimization:
  objective_metric: validation/avg_task_performance_epoch
  run_test: true
