# (ii) Different portions of the scene: agent 0 sees a grayscale zoom on the
# central 16x16 crop (resized back to 32x32), agent 1 sees colour images with
# the central half of the area blacked out (periphery only). Label shift 0.4.
# Other portion splits (input_noise.py: mask regions left|right|top|bottom|center|border):
#   left vs right half: 'dataset.agent_input_noise={0:{type:mask,region:right,fraction:0.5},1:{type:mask,region:left,fraction:0.5}}'
defaults:
  - cifar10_2agents_base
  - _self_

study_name: "CIFAR-10 2 agents centre vs periphery"
logger:
  project: cifar10_2agents_crops

dataset:
  shift_strength: 0.4
  agent_input_noise:
    0:
      type: compose
      steps:
        - {type: grayscale}
        - {type: crop, size: 16}
    1: {type: mask, region: center, fraction: 0.5}
