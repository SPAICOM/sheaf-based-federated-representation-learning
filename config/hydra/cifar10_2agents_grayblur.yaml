# (i) Different sensors: agent 0 sees grayscale images, agent 1 slightly
# blurred colour images (5x5 Gaussian, sigma 1). Label shift 0.4.
# Harsher variant (shift 0.8, stronger blur): cifar10_2agents_grayblur_harsh.
defaults:
  - cifar10_2agents_base
  - _self_

study_name: "CIFAR-10 2 agents grayscale vs blur"
logger:
  project: cifar10_2agents_grayblur

dataset:
  shift_strength: 0.4
  agent_input_noise:
    0: {type: grayscale}
    1: {type: blur, kernel_size: 5, sigma: 1.0}
