defaults:
  - dataset: mfeatures
  - model: mfeat_classifier
  - orchestrator: non_cooperative
  - optimizer: adam
  - _self_

seed: 42

# ── Dataset ───────────────────────────────────────────────────────────────────
# Modality assignments and agent count live here so that changing the
# experimental setup (e.g. fewer agents, different modalities) and the
# corresponding model configs can be done from a single file.
#
# Available modalities and their input dims:
#   fac  216   profile correlations
#   fou   76   Fourier coefficients
#   kar   64   Karhunen-Loève coefficients
#   mor    6   morphological features
#   pix  240   pixel averages in 2x3 windows
#   zer   47   Zernike moments
dataset:
  n_agents: 5
  agent_modalities:
    0: fou
    1: fac
    2: kar
    3: pix
    4: zer
  split_strategy: random_subset
  subset_fraction: 0.8       # each agent sees 80% of training pool
  class_imbalance: true
  imbalance_alpha: 0.1         # fairly skewed — tune this for more/less hetero
  pilot_split: 0.1  
  comm_data: shared_global_pilots

# ── Graph ─────────────────────────────────────────────────────────────────────
graph:
  neighbors_mode: "fully_connected"
  seed: 42
  p: 0.3
  m: 3

# ── Model ─────────────────────────────────────────────────────────────────────
# Decoder settings are inherited from model/mfeat_classifier.yaml.
# Per-agent encoder configs (input_dim must match the modality above).
model:
  agents:
    # 0: {input_dim: 76,  hidden_dims: [256], output_dim: 64, encoder_dropout: 0.3}
    # 1: {input_dim: 216, hidden_dims: [256], output_dim: 64, encoder_dropout: 0.3}
    # 2: {input_dim: 64,  hidden_dims: [256], output_dim: 64, encoder_dropout: 0.3}
    # 3: {input_dim: 240, hidden_dims: [256], output_dim: 64, encoder_dropout: 0.3}
    # 4: {input_dim: 47,  hidden_dims: [256], output_dim: 64, encoder_dropout: 0.3}
    0:
      input_dim: 76      # fou
      hidden_dims: [128, 256]
      output_dim: 32
      encoder_dropout: 0.1
    1:
      input_dim: 216     # fac
      hidden_dims: [256]
      output_dim: 64
      encoder_dropout: 0.1
    2:
      input_dim: 64      # kar
      hidden_dims: [128, 256, 512]
      output_dim: 32
      encoder_dropout: 0.1
    3:
      input_dim: 240     # pix
      hidden_dims: [256, 512]
      output_dim: 64
      encoder_dropout: 0.1
    4:
      input_dim: 47      # zer
      hidden_dims: [64, 128, 256]
      output_dim: 16
      encoder_dropout: 0.1

# ── Logger ────────────────────────────────────────────────────────────────────
logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: sheaf-repr-learning__mfeat
  name: ${now:%Y-%m-%d}_${now:%H-%M-%S}
  save_dir: logs/
  log_model: false
  reinit: true

# ── Trainer ───────────────────────────────────────────────────────────────────
trainer:
  max_epochs: 400
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 10

callbacks:
  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: validation/global_task_performance_epoch
    mode: max
    save_top_k: 1
    save_last: true

  # early_stopping:
  #   _target_: lightning.pytorch.callbacks.EarlyStopping
  #   monitor: validation/global_task_performance_epoch
  #   patience: 15
  #   mode: max

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      orchestrator: non_cooperative, sheaf_frl
