defaults:
  - dataset: hetero_mnist
  - model: cnn_autoencoder
  - orchestrator: sheaf_frl
  - optimizer: sgd
  - _self_

seed: 42
study_name: "HeteroRate MNIST 2 AE agents"

graph:
  neighbors_mode: "fully_connected"
  seed: 42
  p: 0.15
  m: 3
  neighbors: {}

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: sheaf-repr-learning__hetero-rate-2agents-mnist-ae
  group: ${study_name}
  name: ${hydra:runtime.choices.orchestrator}_trial_${hydra:job.num}
  save_dir: logs/
  log_model: false

trainer:
  max_epochs: 50
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 25

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step

dataset:
  split_strategy: grouped_non_iid
  n_agents: 2
  classes_per_agent: 10
  shift_strength: 0.0
  monitor_test_during_fit: true
  batch_size: 64
  num_workers: 0
  mode: min_size
  pilot_split: 0.05
  pilot_batch_size: 64
  comm_data: shared_global_pilots
  groups:
    0:
      agents: [0]
      target_classes: [0, 1, 2, 3, 4, 5]
    1:
      agents: [1]
      target_classes: [4, 5, 6, 7, 8, 9]

model:
  agents:
    0:
      _target_: src.agents.CNNAutoencoder
      encoder_hidden_dims: [32, 64]
      latent_dim: 64
      dropout: 0.0
      use_batchnorm: true
    1:
      _target_: src.agents.CNNAutoencoder
      encoder_hidden_dims: [32, 64]
      latent_dim: 64
      dropout: 0.0
      use_batchnorm: true

orchestrator:
  parseval_normalization: false
  l2_normalization: false
  use_prototypes: false
  log_latent_diagnostics: True
  max_lmb: 0.5
  warmup_epochs: 25
  use_general_maps: false
  soft_maps: false
  alignment_method: procrustes
  gamma: 0.001
  eta: 0.01

optimization:
  objective_metric: validation/avg_task_performance_epoch
  run_test: true

