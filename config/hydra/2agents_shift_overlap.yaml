# ── Two-agent toy of multiagent_mnist_shift_overlap ──────────────────────────
# One edge, one Stiefel map, ~15x faster than the 15-agent config. Intended for
# sweeping lambda and anything else that needs many trials before a full-scale
# confirmation run.
#
# Kept IDENTICAL to the parent config: split_strategy, shift mechanism, pilot
# budget, optimizer, epochs, and the two agents' own target_classes and model
# architectures (agent 0 -> d=128, agent 1 -> d=224, so the edge map is still
# the heterogeneous 224x128 case, not a square one).
#
# Only difference from the parent, besides n_agents:
#   graph.max_edge_frac: 1.0 — with 2 agents there is exactly ONE possible edge
#   and 0.4 would floor to ZERO edges, silently leaving nothing to align.
defaults:
  - dataset: hetero_mnist
  - model: cnn_classifier
  - orchestrator: sheaf_frl
  - optimizer: sgd
  - _self_

seed: 42
study_name: "2-agent shift overlap (toy)"

lmb_study:
  enabled: false
  efficient: true
  n_trials: 15
  n_tune_epochs: 5
  lmb_low: 1e-4
  lmb_high: 1e-1

graph:
  neighbors_mode: "class_overlap"
  max_edge_frac: 1.0          # MUST be 1.0 here: floor(0.4 * 1 edge) = 0 edges
  similarity: intersection

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: 2agents_shift_overlap
  group: ${study_name}
  name: ${hydra:runtime.choices.orchestrator}_trial_${hydra:job.num}
  save_dir: logs/
  log_model: false

optimizer:
  lr: 1e-2

trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 25
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step

dataset:
  split_strategy: overlapping_shift
  n_agents: 2
  shift_strength: 0.5
  monitor_test_during_fit: true
  batch_size: 64
  num_workers: 0
  mode: min_size
  test_split: 0.2
  val_split: 0.05
  pilot_split: 0.02          # -> ~1120 shared pilots, as in the parent config
  pilot_num_samples: null
  pilot_exclusive: false
  comm_data: shared_global_pilots
  pilot_batch_size: 384
  agent_train_samples: 8000
  # Agents 0 and 1 keep the parent config's target classes:
  #   union = {0..8} (9 classes), intersection = {4} (1 class)
  # so union- vs intersection- vs no-filter are all meaningfully different here.
  groups:
    0:
      agents: [0]
      target_classes: [4, 5, 6, 7, 8]
    1:
      agents: [1]
      target_classes: [0, 1, 2, 3, 4]

model:
  agents:
    0:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 128]        # latent d = 128
      decoder_hidden_dims: [256, 128, 64]
      dropout: 0.3
      use_batchnorm: true
    1:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 128, 224]   # latent d = 224
      decoder_hidden_dims: [120]
      dropout: 0.1
      use_batchnorm: true

orchestrator:
  pid_logging: false
  log_latent_diagnostics: true
  warmup_epochs: 0
  use_general_maps: false
  soft_maps: false
  learn_whitening: false      # closed-form path (SWBN is the other branch)
  gamma: 1e-3
  eta: 0.01
  alignment_method: procrustes
  max_lmb: 1e-2
  learn_lmb: false
  dual_rho: null
  comm_task_coeff: 0

optimization:
  objective_metric: validation/avg_task_performance_epoch
  run_test: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      orchestrator: non_cooperative, sheaf_frl
