defaults:
  - dataset: hetero_mnist
  - model: cnn_classifier
  - orchestrator: sheaf_frl
  - optimizer: sgd
  - _self_

seed: 42
study_name: "Shift sweep MNIST 15 agents (overlapping draws)"

# Disabled: validation is now 5% of an agent's 3,600 rows (~180 samples),
# too small to tune lambda against. Either raise dataset.val_split, or set
# orchestrator.learn_lmb=true to get per-edge lambda by dual ascent instead.
lmb_study:
  enabled: false         # set to true to run Optuna search before the full training run
  efficient: true       # if true, tune max_lmb on only the first two agents (cheaper)
  n_trials: 15          # number of Optuna trials
  n_tune_epochs: 5     # epochs per trial
  lmb_low: 1e-4         # lower bound of the log-uniform search interval
  lmb_high: 1e-1

graph:
  neighbors_mode: "class_overlap"
  max_edge_frac: 0.4          # <= 40% of the n(n-1)/2 possible edges
  similarity: intersection    # edge weight: shared-class count ("jaccard" also ok)

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: shift_overlap
  group: ${study_name}
  name: ${hydra:runtime.choices.orchestrator}_trial_${hydra:job.num}
  save_dir: logs/
  log_model: false

optimizer:
  lr: 1e-2

trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 25
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step

dataset:
  # ── Split-first, overlapping agent draws (see HeteroClassificationDataModule
  #    ._setup_overlapping_shift) ───────────────────────────────────────────────
  #   D --test_split--> TEST pool  --> agent i draws n_test ~ P_i
  #     --remainder---> TRAIN pool --> pilots (uniform, pilot_split)
  #                                --> agent i draws agent_train_samples ~ P_i
  #   P_i(y) = s*Unif{C_i} + (1-s)*Unif{Y},  s = shift_strength
  #
  # Agents draw INDEPENDENTLY, so their subsets overlap each other and may
  # contain pilot rows; only TRAIN/TEST stay disjoint (the invariant the
  # communication-accuracy eval needs: maps fit on pilots, scored on test).
  # What this buys over grouped_non_iid:
  #   * every agent holds exactly agent_train_samples rows at any shift_strength
  #   * the realised label marginal equals P_i EXACTLY, instead of the
  #     contention-normalised P_i(k)/sum_j P_j(k) a disjoint partition yields
  #     (under which agent 0 asks 17% of class 4 at s=0.7 and receives 14.5%)
  #   * pilot_split and agent size decouple, so a pilot sweep leaves every
  #     agent's training rows untouched — a controlled ablation
  split_strategy: overlapping_shift
  n_agents: 15
  shift_strength: 0.7
  monitor_test_during_fit: true
  batch_size: 64
  num_workers: 0
  mode: min_size

  # Global split. val_split is carved from each agent's own draw (stratified),
  # so it follows that agent's shifted distribution.
  test_split: 0.2
  val_split: 0.05

  # Pilots: fraction of the TRAIN pool, NOT of the whole corpus — under
  # overlapping_shift the carve happens after the train/test split, so
  # 70k MNIST -> 56k train -> 0.02 * 56,000 = 1,120 pilots. Deliberately
  # smaller than one agent's training set (1,120 vs 3,600).
  pilot_split: 0.02
  # Absolute pilot count. When set it WINS over pilot_split
  # (hetero_datamodule.py::_setup_overlapping_shift), which is how
  # `just pilot-sweep` varies the budget: dataset.pilot_num_samples=256,512,...
  # Absolute counts keep the sweep's x-axis fixed regardless of test_split.
  # null here = use pilot_split.
  pilot_num_samples: null
  comm_data: shared_global_pilots
  # Pilots stay eligible for the agent draws, so a fraction n/|TRAIN| = 6.4% of
  # pilots also sits in any given agent's training set (per edge, both sides:
  # 0.4%). Harmless for the map fit and for comm accuracy (scored on test), but
  # it does make MRR — computed on pilots — partly a train-set metric.
  # Set true to exclude pilots from the agent pool: contamination drops to 0 at
  # any agent size, agent-to-agent overlap is unaffected, and the only cost is a
  # (1 - pilot_split) factor in the feasibility bound. Worth enabling if you
  # raise agent_train_samples much above 3,600.
  pilot_exclusive: false
  # Per-step penalty rows = pilot_batch_size x (class-filter keep rate). Keep
  # matched rows >~ 1.5x the latent dim; 64 was too small once the edge filter
  # applied. Independent of pilot_split — sweep the two separately.
  pilot_batch_size: 384

  # Per-agent draw size. Absolute, NOT a share of the pool, so it is invariant
  # to pilot_split and to shift_strength. Feasibility: n * max_k P_i(k) <= N_k,
  # i.e. n <= |TRAIN|/phi with phi = (1-s) + s*K/|C_i|; worst case here
  # (s=0.9, |C_i|=5) gives phi=1.9 -> n <= 29,473, so 3,600 has ~8x headroom.
  # The sampler raises with the exact bound if this is ever violated.
  #
  # Feasibility is not the binding concern here — OVERLAP is. Agent-to-agent
  # sharing grows linearly as n/|TRAIN|: 6.3% mean / 9.9% max at 3,600, 14% /
  # 22% at 8,000, 35% / 55% at 20,000. Past ~15% mean the "private local data"
  # framing weakens and alignment gets artificially easy, so keep n <~ 8,000.
  # 3,600 also matches the ~3,360 the old disjoint partition produced, which
  # keeps these runs comparable to the grouped_non_iid ones.
  agent_train_samples: 8000
  # agent_test_samples: null   # default: mirrors the global train/test ratio
  #                            #          -> round(3600 * 0.2/0.8) = 900
  groups:
    0:
      agents: [0]
      target_classes: [4, 5, 6, 7, 8]
    1:
      agents: [1]
      target_classes: [0, 1, 2, 3, 4]
    2:
      agents: [2]
      target_classes: [0, 1, 2, 3, 4, 5]
    3:
      agents: [3]
      target_classes: [4, 5, 6, 7, 8, 9]
    4:
      agents: [4]
      target_classes: [0, 1, 2, 7, 8, 9]
    5:
      agents: [5]
      target_classes: [2, 3, 4, 5, 6]
    6:
      agents: [6]
      target_classes: [1, 2, 3, 4, 5, 6]
    7:
      agents: [7]
      target_classes: [3, 4, 5, 6, 7]
    8:
      agents: [8]
      target_classes: [0, 2, 4, 6, 8]
    9:
      agents: [9]
      target_classes: [5, 6, 7, 8, 9]
    10:
      agents: [10]
      target_classes: [1, 2, 3, 4, 5]
    11:
      agents: [11]
      target_classes: [0, 1, 2, 8, 9]
    12:
      agents: [12]
      target_classes: [3, 4, 5, 6, 7, 8]
    13:
      agents: [13]
      target_classes: [1, 4, 6, 8, 9]
    14:
      agents: [14]
      target_classes: [0, 1, 2, 3, 7]

model:
  agents:
    0:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 128]
      decoder_hidden_dims: [256, 128, 64]
      dropout: 0.3
      use_batchnorm: true
    1:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 128, 224]
      decoder_hidden_dims: [120]
      dropout: 0.1
      use_batchnorm: true
    2:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [16, 32, 64]
      decoder_hidden_dims: [128]
      dropout: 0.2
      use_batchnorm: true
    3:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [64, 128, 128]
      decoder_hidden_dims: [256, 128]
      dropout: 0.25
      use_batchnorm: true
    4:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 48, 96, 192]
      decoder_hidden_dims: [192, 96]
      dropout: 0.3
      use_batchnorm: true
    5:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [24, 48, 96]
      decoder_hidden_dims: [96]
      dropout: 0.15
      use_batchnorm: true
    6:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 128, 256]
      decoder_hidden_dims: [256]
      dropout: 0.4
      use_batchnorm: true
    7:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [24, 48, 96, 144]
      decoder_hidden_dims: [64, 32]
      dropout: 0.1
      use_batchnorm: true
    8:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [48, 96, 160]
      decoder_hidden_dims: [160, 80]
      dropout: 0.2
      use_batchnorm: true
    9:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 80]
      decoder_hidden_dims: [100]
      dropout: 0.05
      use_batchnorm: true
    10:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [40, 80, 120]
      decoder_hidden_dims: [120, 60]
      dropout: 0.2
      use_batchnorm: true
    11:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [48, 96, 192, 240]
      decoder_hidden_dims: [256, 128]
      dropout: 0.2
      use_batchnorm: true
    12:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [20, 40, 60, 80]
      decoder_hidden_dims: [80]
      dropout: 0.2
      use_batchnorm: true
    13:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 96]
      decoder_hidden_dims: [192, 96]
      dropout: 0.25
      use_batchnorm: true
    14:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [56, 112, 160]
      decoder_hidden_dims: [128]
      dropout: 0.1
      use_batchnorm: true

orchestrator:
  pid_logging: false
  log_latent_diagnostics: true
  # Sheaf FRL specific
  warmup_epochs: 0
  use_general_maps: false
  soft_maps: false
  align_on_intersection: false
  # false -> closed-form ZCA, refit at every epoch end from each agent's own
  # training latents (eval mode, no grad, augmentation off), EMA-smoothed
  # across refits, with a scale-free relative ridge. The knobs behind it
  # (zca_refit_mode / zca_fit_max_samples / zca_ema_momentum /
  # whitening_eps_rel / whitening_eps_abs) keep their defaults from
  # config/hydra/orchestrator/sheaf_frl.yaml; agents hold 3,600 rows here,
  # well under zca_fit_max_samples, so every refit sees the WHOLE split.
  # true -> learnable SWBN instead, estimated on pilot batches only.
  learn_whitening: false
  # # CE Sheaf FRL specific
  # phase_a_epochs: 1
  # phase_c_epochs: 2
  # # Sheaf compressed FRL
  # compression_factor: 0.5
  # Sheaf FMTL specific
  gamma: 1e-3
  eta: 0.01
  # Post-training alignment
  alignment_method: procrustes
  max_lmb: 1e-2
  learn_lmb: false
  dual_rho: null
  comm_task_coeff: 0

optimization:
  objective_metric: validation/avg_task_performance_epoch
  run_test: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset.shift_strength: 0.5, 0.9
      orchestrator: sheaf_frl  # add comfed / ce_sheaf_frl as needed
