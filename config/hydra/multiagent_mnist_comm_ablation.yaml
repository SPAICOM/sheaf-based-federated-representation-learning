defaults:
  - dataset: hetero_mnist
  - model: cnn_classifier
  - orchestrator: ce_sheaf_frl
  - optimizer: sgd
  - _self_

seed: 42
study_name: "CommFrac ablation CESheafFRL MNIST 15 agents"

# ── Communication-fraction ablation ───────────────────────────────────────────
# Replicates the multiagent_mnist_shift_distr setup (same 15-agent heterogeneous
# MNIST, same class_overlap graph, same models), runs for 100 epochs, and varies
# *how often agents communicate* via orchestrator.comm_percentage (the exact
# collaborative-epoch count = round(comm_percentage/100 * total_epochs), spread
# uniformly, last epoch anchored). shift_strength is held FIXED.
#
# SWEEPS ARE DRIVEN FROM THE CLI (see the `comm-ablation-*` recipes in justfile),
# not hard-coded here — a plain run uses the single defaults below; add
# `--multirun orchestrator.comm_percentage=1,5,... orchestrator.local_reg=false,true`
# for the CESheafFRL grid, or `--multirun orchestrator=non_cooperative,sheaf_frl`
# for the baselines.
#
# lmb_study is DISABLED on purpose: max_lmb is held fixed across every run so the
# only thing varying is the communication fraction (and local_reg) — an Optuna
# search per trial would retune lambda for each cell and confound the ablation.

lmb_study:
  enabled: false
  efficient: true
  n_trials: 15
  n_tune_epochs: 5
  lmb_low: 1e-4
  lmb_high: 1e-1

graph:
  neighbors_mode: "class_overlap"
  max_edge_frac: 0.4          # <= 40% of the n(n-1)/2 possible edges
  similarity: intersection    # edge weight: shared-class count ("jaccard" also ok)

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: comm_ablation
  group: ${study_name}
  name: ${hydra:runtime.choices.orchestrator}_p${orchestrator.comm_percentage}_lr${orchestrator.local_reg}_${hydra:job.num}
  save_dir: logs/
  log_model: false

optimizer:
  lr: 1e-2

trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 25
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step

dataset:
  split_strategy: grouped_non_iid
  n_agents: 15
  classes_per_agent: 10
  shift_strength: 0.9
  monitor_test_during_fit: true
  batch_size: 64
  num_workers: 0
  mode: min_size
  pilot_split: 0.1
  pilot_batch_size: 64
  comm_data: shared_global_pilots
  groups:
    0:
      agents: [0]
      target_classes: [4, 5, 6, 7, 8]
    1:
      agents: [1]
      target_classes: [0, 1, 2, 3, 4]
    2:
      agents: [2]
      target_classes: [0, 1, 2, 3, 4, 5]
    3:
      agents: [3]
      target_classes: [4, 5, 6, 7, 8, 9]
    4:
      agents: [4]
      target_classes: [0, 1, 2, 7, 8, 9]
    5:
      agents: [5]
      target_classes: [2, 3, 4, 5, 6]
    6:
      agents: [6]
      target_classes: [1, 2, 3, 4, 5, 6]
    7:
      agents: [7]
      target_classes: [3, 4, 5, 6, 7]
    8:
      agents: [8]
      target_classes: [0, 2, 4, 6, 8]
    9:
      agents: [9]
      target_classes: [5, 6, 7, 8, 9]
    10:
      agents: [10]
      target_classes: [1, 2, 3, 4, 5]
    11:
      agents: [11]
      target_classes: [0, 1, 2, 8, 9]
    12:
      agents: [12]
      target_classes: [3, 4, 5, 6, 7, 8]
    13:
      agents: [13]
      target_classes: [1, 4, 6, 8, 9]
    14:
      agents: [14]
      target_classes: [0, 1, 2, 3, 7]

model:
  agents:
    0:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 128]
      decoder_hidden_dims: [256, 128, 64]
      dropout: 0.3
      use_batchnorm: true
    1:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 128, 224]  # deepened to 4 blocks: 28->14->7->3->1 (was [32,64,128], dup of 0/7)
      decoder_hidden_dims: [120]
      dropout: 0.1
      use_batchnorm: true
    2:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [16, 32, 64]
      decoder_hidden_dims: [128]
      dropout: 0.2
      use_batchnorm: true
    3:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [64, 128, 128]  # +3rd block: pools 7x7 -> 3x3
      decoder_hidden_dims: [256, 128]
      dropout: 0.25
      use_batchnorm: true
    4:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 48, 96, 192]
      decoder_hidden_dims: [192, 96]
      dropout: 0.3
      use_batchnorm: true
    5:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [24, 48, 96]
      decoder_hidden_dims: [96]
      dropout: 0.15
      use_batchnorm: true
    6:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 128, 256]
      decoder_hidden_dims: [256]
      dropout: 0.4
      use_batchnorm: true
    7:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [24, 48, 96, 144]
      decoder_hidden_dims: [64, 32]
      dropout: 0.1
      use_batchnorm: true
    8:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [48, 96, 160]
      decoder_hidden_dims: [160, 80]
      dropout: 0.2
      use_batchnorm: true
    9:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 80]
      decoder_hidden_dims: [100]
      dropout: 0.05
      use_batchnorm: true
    10:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [40, 80, 120]
      decoder_hidden_dims: [120, 60]
      dropout: 0.2
      use_batchnorm: true
    11:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [48, 96, 192, 240]
      decoder_hidden_dims: [256, 128]
      dropout: 0.2
      use_batchnorm: true
    12:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [20, 40, 60, 80]
      decoder_hidden_dims: [80]
      dropout: 0.2
      use_batchnorm: true
    13:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 96]
      decoder_hidden_dims: [192, 96]
      dropout: 0.25
      use_batchnorm: true
    14:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [56, 112, 160]
      decoder_hidden_dims: [128]
      dropout: 0.1
      use_batchnorm: true

orchestrator:
  pid_logging: false
  log_latent_diagnostics: true
  # Sheaf FRL specific (fixed across the ablation)
  warmup_epochs: 0
  use_general_maps: false
  soft_maps: false
  # Fair comparison with non_cooperative: score misalignment/MRR — and fit the
  # post-hoc alignment maps (non_cooperative & the post-hoc baselines) — only on
  # pilots whose class is in the edge's target-class overlap (the region both
  # agents trained on). align_on_intersection makes SheafFRL/CE's TRAINING map
  # use the same intersection support, so every method is fit+scored alike.
  eval_on_class_intersection: true
  align_on_intersection: true
  learn_whitening: true
  anchor_selection: all
  num_anchors: 32
  max_lmb: 1e-2           # held fixed (lmb_study disabled) so only comm-fraction varies
  learn_lmb: false
  dual_rho: null
  comm_task_coeff: 0
  total_epochs: ${trainer.max_epochs}   # schedule horizon (100); comm epochs = round(comm_percentage/100 * this)
  # Single-run defaults; the CLI sweeps override these (see justfile recipes).
  # comm_percentage → exact number of collaborative epochs (uniform, last-anchored);
  # local_reg → regularize toward frozen neighbours during local epochs.
  comm_percentage: 50
  local_reg: false
  # Post-training alignment method (used by the non_cooperative / sheaf_frl-family
  # post-hoc baselines; ignored by the SheafFRL/CE learned maps).
  alignment_method: procrustes

optimization:
  objective_metric: validation/avg_task_performance_epoch
  run_test: true

# Sweeps are CLI-driven (justfile: comm-ablation-ce / comm-ablation-baselines), so
# no hydra.sweeper.params here. A plain run is a single job with the defaults above;
# add `--multirun` plus the swept overrides to launch a grid.
