# @package _global_
defaults:
  - override /hydra/sweeper: optuna

hydra:
  mode: MULTIRUN
  sweeper:
    direction: maximize
    study_name: ${study_name}_SheafFMTL_ER
    n_trials: 20
    n_jobs: 1
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: ${seed}
    params:
      orchestrator.gamma: choice(3e-4, 1e-3, 3e-3)
      orchestrator.lambda_reg: choice(1e-4, 5e-4, 1e-3, 5e-3, 1e-2)
      orchestrator.eta: choice(1e-4, 1e-3, 1e-2, 5e-2)
      optimizer.lr: tag(log, interval(5e-4, 5e-2))
      optimizer.weight_decay: choice(0.0, 1e-5, 1e-4, 1e-3)
      optimizer.momentum: choice(0.85, 0.9, 0.95)

graph:
  neighbors_mode: erdos_renyi

trainer:
  deterministic: false
  num_sanity_val_steps: 0

callbacks:
  checkpoint:
    save_top_k: 0
    save_last: false

optimization:
  run_test: false
  cleanup_artifacts: false
