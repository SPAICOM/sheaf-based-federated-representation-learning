# @package _global_
defaults:
  - override /hydra/sweeper: optuna

hydra:
  mode: MULTIRUN
  sweeper:
    direction: maximize
    study_name: ${study_name}
    n_trials: 20
    n_jobs: 1
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: ${seed}
    params:
      orchestrator.lambda_sheaf: choice( 1e-2, 5e-2, 1e-1, 5e-1, 1e0, 5e0)
      #orchestrator.anchor_strategy: choice(prototype, semantic_pilots, clustering, dynamic)
      #orchestrator.num_anchors: choice(16, 32, 64, 128)
      orchestrator.parseval_normalization: choice(false, true)
      #orchestrator.l2_normalization: choice(false, true)
      optimizer.lr: tag(log, interval(1e-4, 1e-1))
      optimizer.weight_decay: choice(1e-5, 1e-4, 1e-3)
      optimizer.momentum: choice(0.85, 0.9, 0.95)
