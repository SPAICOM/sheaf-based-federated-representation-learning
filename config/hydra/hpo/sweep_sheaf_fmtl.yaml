# @package _global_
defaults:
  - override /hydra/sweeper: optuna

hydra:
  mode: MULTIRUN
  sweeper:
    direction: maximize
    study_name: ${study_name}
    n_trials: 20
    n_jobs: 1
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: ${seed}
    params:
      #orchestrator.gamma: choice(0.01, 0.03)
      #orchestrator.gamma: choice(0.0001, 0.0003)
      orchestrator.max_lmb: choice(1e-4, 5e-4, 1e-3, 5e-3, 1e-2, 5e-2)
      orchestrator.eta: choice(1e-4, 1e-3, 1e-2, 5e-2, 1e-1)
      optimizer.lr: tag(log, interval(1e-4, 1e-1))
      optimizer.weight_decay: choice(1e-5, 1e-4, 1e-3)
      optimizer.momentum: choice(0.85, 0.9, 0.95)
