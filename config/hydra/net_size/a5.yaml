# @package dataset
# Agent-count scaling study — network of 5 agents (generated by scratchpad/gen_net_size.py).
# Rotating 6-class windows (mod 10) give overlapping, heterogeneous
# per-agent skews that scale to any network size.
n_agents: 5
groups:
  0:
    agents: [0]
    target_classes: [0, 1, 2, 3, 4, 5]
  1:
    agents: [1]
    target_classes: [1, 2, 3, 4, 5, 6]
  2:
    agents: [2]
    target_classes: [2, 3, 4, 5, 6, 7]
  3:
    agents: [3]
    target_classes: [3, 4, 5, 6, 7, 8]
  4:
    agents: [4]
    target_classes: [4, 5, 6, 7, 8, 9]
