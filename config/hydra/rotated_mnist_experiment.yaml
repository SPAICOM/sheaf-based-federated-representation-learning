defaults:
  - dataset: mnist
  - model: cnn_classifier
  - orchestrator: sheaf_frl
  - optimizer: sgd
  - _self_
  - optional hpo: null


seed: 42
study_name: "Rotated MNIST"

agent_rotation_groups:
  group_values: [0, 90, 180, 270]
  seed: ${seed}

graph:
  neighbors_mode: "erdos_renyi"
  seed: 42
  p: 0.3
  m: 3
  neighbors: {}

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: rotated_mnist
  group: ${study_name}
  name: ${hydra:runtime.choices.orchestrator}_${hydra:job.num}
  save_dir: logs/
  log_model: false

trainer:
  max_epochs: 20
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 5

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step

  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: validation/avg_task_performance_epoch
    mode: max
    save_top_k: 1
    save_last: true

  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: validation/avg_task_performance_epoch
    patience: 10
    mode: max

dataset:
  split_strategy: uniform
  n_agents: 40
  batch_size: 256
  num_workers: 0
  monitor_test_during_fit: false
  mode: min_size
  starve_clients: true
  pilot_split: 0.05
  pilot_batch_size: 64
  comm_data: shared_global_pilots
  pilot_apply_agent_rotations: true

model:
  encoder_hidden_dims: [32, 64, 128]
  decoder_hidden_dims: [256]
  dropout: 0.1
  use_batchnorm: true

orchestrator:
  max_lmb: 0.01
  anchor_strategy: pilots
  num_anchors: 64
  parseval_normalization: false
  l2_normalization: false
  #filter_unseen_classes: false   
  local_steps: 5
  use_prototypes: false

optimization:
  objective_metric: validation/avg_task_performance_epoch
  run_test: true
