defaults:
  - dataset: mnist
  - model: cnn_classifier
  - orchestrator: sheaf_frl
  - optimizer: sgd
  - _self_


seed: 42

agent_rotations:
  0: 0
  1: 90
  2: 180
  3: 270

agents:
  0: {}
  1: {}
  2: {}
  3: {}

graph:
  neighbors_mode: "fully_connected"
  seed: 42
  p: 0.3
  m: 3
  neighbors: {}

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: sheaf-repr-learning__rotated-mnist
  name: ${now:%Y-%m-%d}_${now:%H-%M-%S}
  save_dir: logs/
  log_model: false
  reinit: true

trainer:
  max_epochs: 50
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 25

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step

  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: validation/global_task_performance_epoch
    mode: max
    save_top_k: 1
    save_last: true

  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: validation/global_task_performance_epoch
    patience: 10
    mode: max

dataset:
  split_strategy: uniform
  batch_size: 64
  num_workers: 4
  mode: min_size
  pilot_split: 0.05
  pilot_batch_size: 64

model:
  encoder_hidden_dims:
    0: [16, 32]
    1: [16, 32, 64]
    2: [16, 32, 64, 128]
    3: [16, 32, 64, 128, 256]
  decoder_hidden_dims: [256]

orchestrator:
  max_lmb: 0.01
  #anchor_strategy: prototype
  #num_anchors: 32
  parseval_normalization: false
  l2_normalization: false
