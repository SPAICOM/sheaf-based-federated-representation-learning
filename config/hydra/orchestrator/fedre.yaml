_target_: src.orchestrators.FedRE

# Official FedRE defaults (-slr, -hbs): one server SGD epoch per round on the
# K uploaded (entangled representation, soft label) pairs.
server_lr: 0.01
head_batch_size: 10
# null = native FedRE: identity message, cross-agent = sender extractor + shared
# head. 'general' | 'procrustes' | 'relative' add post-hoc pilot alignment.
alignment_method: null
# FC representation mapping: decoder = Sequential(Linear(d_i -> rm_dim), shared head).
# null = the largest latent dim in the network (no RM if all dims are equal).
# With RM, a post-hoc alignment_method above is required.
rm_dim: null

# Information-theoretic PID logging (Liang et al. 2023).
# Implemented in BaseOrchestrator → applies to *every* orchestrator that
# forwards **kwargs to super().__init__.  Toggle pid_logging to enable.
pid_logging: False
pid_methods: ['cvxpy']   # ['cvxpy', 'batch'] or any subset.
pid_pairs: neighbors     # 'neighbors' (graph edges) or 'all' (full clique).
pid_num_clusters: 10     # K-Means clusters per view (CVX method).
pid_max_samples: 4000    # Down-sample the training set for the CVX path.
pid_discrim_epochs: 40   # Neural-PID discriminator epochs.
pid_align_epochs: 10     # Neural-PID alignment epochs.
pid_batch_size: 256      # Neural-PID mini-batch size.
pid_hidden_dim: 32
pid_embed_dim: 10
