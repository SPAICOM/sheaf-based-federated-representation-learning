_target_: src.orchestrators.sheaf_fmtl.SheafFMTL

# Post-hoc map fit scoping; see non_cooperative.yaml.
# none | union | intersection
align_class_filter: none

gamma: 0.01
max_lmb: 1e-02
lambda_schedule: null
eta: 0.01

agents: null
neighbors: {}

# Information-theoretic PID logging (Liang et al. 2023).
# Implemented in BaseOrchestrator → applies to *every* orchestrator that
# forwards **kwargs to super().__init__.  Toggle pid_logging to enable.
pid_logging: False
pid_methods: ['cvxpy']   # ['cvxpy', 'batch'] or any subset.
pid_pairs: neighbors     # 'neighbors' (graph edges) or 'all' (full clique).
pid_num_clusters: 10     # K-Means clusters per view (CVX method).
pid_max_samples: 4000    # Down-sample the training set for the CVX path.
pid_discrim_epochs: 40   # Neural-PID discriminator epochs.
pid_align_epochs: 10     # Neural-PID alignment epochs.
pid_batch_size: 256      # Neural-PID mini-batch size.
pid_hidden_dim: 32
pid_embed_dim: 10

# Where each agent's post-hoc whitening operator is estimated:
#   train  - the full local training split (classical post-hoc recipe)
#   pilots - the pilot split, i.e. the rows SheafFRL/CESheafFRL's SWBN layers
#            see during training. Use this when comparing against a
#            learn_whitening=true SheafFRL run, or the comparison confounds the
#            alignment map with where the normalisation statistics came from.
whitening_source: pilots   # fit the post-hoc whitening on the PILOT split,
                           # matching where SheafFRL/CESheafFRL SWBN layers get
                           # their statistics. 'train' (the classical post-hoc
                           # recipe) confounds the alignment map with the
                           # normalisation source and is worth ~+9pt to whoever
                           # gets pilots; keep both sides on pilots to compare.