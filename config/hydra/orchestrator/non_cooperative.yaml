_target_: src.orchestrators.NonCooperativeLearning

# Post-hoc alignment for the communication-accuracy evaluation.
alignment_method: general  # 'general' | 'procrustes' | 'relative'
# Restrict the post-hoc map fit to an edge's relevant classes, mirroring
# SheafFRL's own edge_class_filter so the two are compared like for like:
#   none         — fit on every matched pilot (classical post-hoc recipe)
#   union        — only pilots whose class either endpoint is expert in
#   intersection — only pilots whose class BOTH endpoints are expert in
# Leaving this at 'none' while SheafFRL filters (or vice versa) means the two
# methods fit their maps on different rows, which is not a fair comparison.
align_class_filter: none
# Edge anchor extraction, applied before fitting — same names/semantics as
# SheafFRL's anchor_selection, so this baseline can be swept over the same
# anchor budget/strategy as a SheafFRL run (one-shot here: post-hoc alignment
# has no refresh cadence):
#   all          — every matched pilot row (num_anchors ignored)
#   random       — num_anchors rows, subsampled once
#   proto_class  — protos_per_class prototypes per class (within-class k-means)
#   proto_kmeans — unsupervised k-means (K=num_anchors) prototypes
anchor_selection: all
num_anchors: 128
# Where each agent's whitening operator is estimated:
#   train  — the full local training split (classical post-hoc recipe)
#   pilots — the pilot split, i.e. exactly the rows SheafFRL/CESheafFRL's SWBN
#            layers see. Use this when comparing against learn_whitening=true
#            runs, or the comparison confounds the alignment map with where the
#            normalisation statistics came from. (learn_whitening=false runs fit
#            their ZCA on TRAINING latents, so 'train' is their matched setting.)
whitening_source: train
protos_per_class: 1
anchor_parseval_normalize: null  # Parseval-prewhiten each side's anchor frame.
                                 # null = auto (True for 'relative', False for
                                 # 'general'/'procrustes'); set true/false to
                                 # override for every method.

# Information-theoretic PID logging (Liang et al. 2023).
# Implemented in BaseOrchestrator → applies to *every* orchestrator that
# forwards **kwargs to super().__init__.  Toggle pid_logging to enable.
pid_logging: False
pid_methods: ['cvxpy']   # ['cvxpy', 'batch'] or any subset.
pid_pairs: neighbors     # 'neighbors' (graph edges) or 'all' (full clique).
pid_num_clusters: 10     # K-Means clusters per view (CVX method).
pid_max_samples: 4000    # Down-sample the training set for the CVX path.
pid_discrim_epochs: 40   # Neural-PID discriminator epochs.
pid_align_epochs: 10     # Neural-PID alignment epochs.
pid_batch_size: 256      # Neural-PID mini-batch size.
pid_hidden_dim: 32
pid_embed_dim: 10
