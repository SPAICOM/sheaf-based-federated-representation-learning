_target_: src.orchestrators.CESheafFRL

max_lmb: 3.23e-3
lambda_schedule: null
anchor_strategy: pilots
learn_whitening: True  # learnable SWBN whitening (g_phi_i); set False for closed-form ZCA
sparse_communication: False
sparse_epsilon: 1e-2
log_latent_diagnostics: True
num_anchors: 32
local_steps: 1
update_v_every_n_epochs: 1
warmup_epochs: 0
neighbors: {}
filter_unseen_classes: False
use_prototypes: False
comm_task_coeff: 1.0  # weight for the after-communication task loss (mu; 0 = disabled)
align_on_intersection: False  # if True, filter pilots to intersection of target classes per edge (default: union)

# ── Decoupled three-phase schedule (communication-efficient) ──────────────────
phase_c_epochs: 1   # T_C: classical SheafFRL epochs per outer iteration
phase_a_epochs: 2   # T_A: communication-free (frozen-pilot) epochs per outer iteration

# Information-theoretic PID logging (Liang et al. 2023).
pid_logging: True
pid_methods: ['cvxpy']   # ['cvxpy', 'batch'] or any subset.
pid_pairs: neighbors     # 'neighbors' (graph edges) or 'all' (full clique).
pid_num_clusters: 10     # K-Means clusters per view (CVX method).
pid_max_samples: 4000    # Down-sample the training set for the CVX path.
pid_discrim_epochs: 40   # Neural-PID discriminator epochs.
pid_align_epochs: 10     # Neural-PID alignment epochs.
pid_batch_size: 256      # Neural-PID mini-batch size.
pid_hidden_dim: 32
pid_embed_dim: 10
