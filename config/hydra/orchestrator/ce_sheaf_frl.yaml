_target_: src.orchestrators.CESheafFRL

# ── Sheaf-penalty weight λ: three mutually exclusive modes ────────────────────
#   fixed     — max_lmb on every edge            (lambda_schedule: null, learn_lmb: false)
#   scheduled — max_lmb warmed up over training  (lambda_schedule: cosine|exp, learn_lmb: false)
#   learned   — per-edge λ_e by dual ascent on P_e/(2·d_e) ≤ dual_rho
#               (learn_lmb: true; max_lmb and lambda_schedule are ignored)
max_lmb: 3.23e-3
lambda_schedule: null
learn_lmb: false
dual_rho: 0.1        # tolerated fraction of the unaligned residual energy, in (0, 1)
dual_lr: 0.01        # per-step dual-ascent rate on the normalised violation
dual_lmb_max: 100.0  # safety cap per multiplier (guards genuinely infeasible edges)
anchor_strategy: pilots
learn_whitening: True  # learnable SWBN whitening (g_phi_i); set False for closed-form ZCA
sparse_communication: False
sparse_epsilon: 1e-2
log_latent_diagnostics: True
# ── Per-edge anchor selection ─────────────────────────────────────────────────
# At every map refresh the candidate pool is the FULL pilot split
# (class-filtered per edge, matched by sample id); the map is fit on the
# selected anchors.  Per training step:
#   all          — map fit on every matched pilot; the step penalty consumes the
#                  rotating pilot batch (an epoch cycles the whole pool; each
#                  step's exchanged batch latents are counted as communication)
#   random       — num_anchors rows subsampled from the pool once per refresh;
#                  the step penalty re-encodes exactly those rows (budgeted
#                  once-per-window communication)
#   proto_class  — 1 (or protos_per_class, via within-class k-means) prototype
#                  per class, à la FedProto; step penalty uses batch prototypes
#   proto_kmeans — k-means (K=num_anchors) refit on the whitened matched pool
#                  at every refresh; step penalty averages the batch under the
#                  window's assignment
anchor_selection: all
num_anchors: 32          # edge anchor budget: subset size (random) / K (proto_kmeans)
protos_per_class: 1      # only used by proto_class
anchor_parseval_normalize: False  # Parseval-prewhiten the selected anchors per side
local_steps: 1
update_v_every_n_epochs: 1
warmup_epochs: 0
neighbors: {}
filter_unseen_classes: False
comm_task_coeff: 1.0  # weight for the after-communication task loss (mu; 0 = disabled)
align_on_intersection: False  # if True, filter pilots to intersection of target classes per edge (default: union)

# ── Decoupled communication schedule (communication-efficient) ────────────────
# comm_percentage (in (0, 100]) fixes the EXACT number of collaborative
# (communicating) epochs, round(comm_percentage/100 * total_epochs), spread as
# uniformly as possible over the run; the rest are communication-free local
# epochs. total_epochs: null reads the horizon from trainer.max_epochs.
# (Replaces the old cyclic collab_epochs/local_epochs split, still accepted as a
# deprecated alias. 0% is not valid — use the non_cooperative orchestrator.)
comm_percentage: 50
total_epochs: null
# During local epochs the sheaf regularization disappears by default (pure local
# task training); local_reg: true instead pulls each node toward the rotated,
# whitened representations its neighbours sent during the last collaborative epoch.
local_reg: false

# Information-theoretic PID logging (Liang et al. 2023).
pid_logging: True
pid_methods: ['cvxpy']   # ['cvxpy', 'batch'] or any subset.
pid_pairs: neighbors     # 'neighbors' (graph edges) or 'all' (full clique).
pid_num_clusters: 10     # K-Means clusters per view (CVX method).
pid_max_samples: 4000    # Down-sample the training set for the CVX path.
pid_discrim_epochs: 40   # Neural-PID discriminator epochs.
pid_align_epochs: 10     # Neural-PID alignment epochs.
pid_batch_size: 256      # Neural-PID mini-batch size.
pid_hidden_dim: 32
pid_embed_dim: 10
