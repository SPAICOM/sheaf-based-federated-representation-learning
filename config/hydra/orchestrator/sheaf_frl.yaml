_target_: src.orchestrators.SheafFRL

# ── Sheaf-penalty weight λ: three mutually exclusive modes ────────────────────
#   fixed     — max_lmb on every edge            (lambda_schedule: null, learn_lmb: false)
#   scheduled — max_lmb warmed up over training  (lambda_schedule: cosine|exp, learn_lmb: false)
#   learned   — per-edge λ_e by dual ascent on P_e/(2·d_e) ≤ dual_rho
#               (learn_lmb: true; max_lmb and lambda_schedule are ignored)
max_lmb: 3.82e-3
lambda_schedule: null
learn_lmb: false
dual_rho: 0.1        # tolerated fraction of the unaligned residual energy, in (0, 1)
dual_lr: 0.01        # per-step dual-ascent rate on the normalised violation
dual_lmb_max: 100.0  # safety cap per multiplier (guards genuinely infeasible edges)
anchor_strategy: pilots
# Test/monitoring evaluation (comm accuracy, misalignment loss, MRR):
#   posthoc — run the non-cooperative post-training pipeline on the trained
#             encoders (closed-form whitening on whitening_source + one
#             alignment_method map per edge on the matched pilots), so the
#             metrics are exactly NonCooperativeLearning's; default for both
#             learn_whitening values.
#   learned — evaluate through the learned whitening / restriction maps.
eval_alignment: posthoc
alignment_method: procrustes   # posthoc map type ('general' | 'procrustes' | 'relative')
whitening_source: pilots       # posthoc whitening source ('train' | 'pilots' | 'train+pilots')
posthoc_whitening_shrinkage: auto # post-hoc whitening shrinkage towards (tr/d) I: 0.0 off,
                                  # float in [0,1) fixed, 'auto' = Ledoit-Wolf per agent
pilot_bn_mode: update   # BatchNorm + CenterNorm in the per-step pilot passes: update (pilot-batch
                        # stats; pilots update the running stats of both; measured ~6-13pt
                        # private-acc loss at test with BN, 2026-10-22) | running (use the running
                        # stats, don't update them) | frozen_batch (batch stats, no update)
pilot_center_mode: batch  # CenterNorm centre of the per-step pilot passes when they don't update it
                          # (pilot_bn_mode running/frozen_batch): batch (pilot-batch mean) |
                          # running (task-only running mean, the origin used at evaluation)
whitening: True        # False = no whitening during training (no SWBN, no ZCA): penalty and maps on raw latents
posthoc_whitening: True # False = the posthoc evaluation map is fitted on raw latents too
learn_whitening: True  # learnable SWBN whitening (g_phi_i); set False for closed-form ZCA
swbn_fit_source: pilots # where SWBN collects its statistics (learn_whitening: True):
                        #   pilots — updated on the per-step pilot batch
                        #   train  — updated on the agent's own training batches,
                        #            which go encoder -> whiten -> colour (frozen
                        #            running stats) -> decoder; pilots only apply them
swbn_momentum: 0.95     # EMA retention of the SWBN running mean/var (learn_whitening: True)
penalty_lr: null        # learning rate of the sheaf-penalty gradient; null = the optimizer lr.
                        # Shares the momentum buffer and cosine schedule, so under SGD
                        # it acts like lambda * penalty_lr / lr
# VICReg-style anti-collapse terms (Bardes, Ponce & LeCun 2022). The sheaf
# penalty plays VICReg's invariance term between the agents' "views" of a pilot;
# these add, for every agent, a variance hinge and a covariance term on its raw
# pilot latents, scaled by lambda with the penalty:
#   lambda * (sheaf + vicreg_var_coeff * sum_i v(Z_i) + vicreg_cov_coeff * sum_i c(Z_i))
# Default weights keep VICReg's 25 : 25 : 1 ratio.
vicreg_vc: false
vicreg_var_coeff: 1.0
vicreg_cov_coeff: 0.04
vicreg_gamma: 1.0       # target std per latent dimension

# ── Closed-form (ZCA) whitening — only read when learn_whitening: False ───────
zca_refit_mode: exact      # where the epoch-end fit gets its latents:
                           #   exact  — re-encode the agent's train split now
                           #            (eval mode, no grad, augmentation off):
                           #            the statistics of the encoder the next
                           #            epoch actually uses, on the same clean
                           #            distribution the operator is applied to
                           #   buffer — reuse the per-step train-mode latents
                           #            collected during the epoch (no extra
                           #            forward pass, but a moving encoder,
                           #            augmented inputs, min_size truncation)
zca_refit_source: train    # where the closed-form whitening statistics come from:
                           #   train        — the agent's private training split only
                           #   pilots       — the shared pilot split only
                           #   train+pilots — both: the pilots become part of this agent's
                           #                  own data. Pair with model.pilot_loss_weight > 0
                           #                  so the pilots are also SUPERVISED, and with the
                           #                  baseline's orchestrator.whitening_source=train+pilots.
whitening_shrinkage: 0.0  # closed-form ZCA shrinkage towards (tr/d) I: 0.0 off,
                          # float in [0,1) fixed, 'auto' = Ledoit-Wolf per refit
                          # (pair zca_refit_source: pilots + auto to train in the
                          # exact frame the posthoc eval whitens in)
zca_fit_max_samples: 8192  # per-agent rows re-encoded per refit (exact mode);
                           # redrawn every epoch, so a run still covers the
                           # whole split
zca_ema_momentum: 0.0      # EMA retention on (E[z], E[z z^T]) across refits.
                           # OFF by default: it smooths the frame the maps are
                           # fit in, but the lag costs more than the jitter it
                           # removes while the encoder is still moving —
                           # measured whiteness ||cov-I||/sqrt(d) on train went
                           # 0.076 (0.0) -> 0.365 (0.5) -> 0.888 (0.9), the last
                           # no better than not whitening at all
whitening_eps_rel: 1e-4    # eigenvalue floor as a fraction of lambda_max —
                           # scale-free, caps the whitened condition number at
                           # 1/eps_rel
whitening_eps_abs: 0.0     # extra absolute floor; set 1e-2 with
                           # whitening_eps_rel: 0.0 to restore the old
                           # absolute-ridge behaviour exactly

# ── Sheaf-penalty normalisation ───────────────────────────────────────────────
#   dim    — divide by the constant 2*d_e (the whitened-unaligned baseline).
#            Correct only while the latents really are white, and because the
#            denominator does not depend on the representation the penalty stays
#            homogeneous of degree 2 in the encoder output: with a FROZEN
#            whitening operator (learn_whitening: false) gradient descent can
#            lower it just by shrinking the latents, and since whitening
#            equalises every direction to unit variance that pressure is the
#            same on a lambda~1 direction as on a lambda~1e-4 one. Deleting the
#            weak ones is nearly free for the task loss -> the latent space
#            collapses bottom-up (measured: effective rank 36 -> 2.3).
#   energy — divide by the CURRENT whitened energy of the two sides. Exactly
#            scale-invariant, so the shrink gradient is 0 instead of +2.0 and
#            every per-direction gradient turns negative. Agrees with 'dim'
#            whenever the latents are genuinely white, so lambda keeps its
#            meaning; they diverge exactly when whitening has stopped working.
penalty_norm: energy
sparse_communication: False
sparse_epsilon: 1e-2
log_latent_diagnostics: True
# ── Per-edge anchor selection ─────────────────────────────────────────────────
# At every map refresh the candidate pool is the FULL pilot split
# (class-filtered per edge, matched by sample id); the map is fit on the
# selected anchors.  Per training step:
#   all          — map fit on every matched pilot; the step penalty consumes the
#                  rotating pilot batch (an epoch cycles the whole pool; each
#                  step's exchanged batch latents are counted as communication)
#   random       — num_anchors rows subsampled from the pool once per refresh;
#                  the step penalty re-encodes exactly those rows (budgeted
#                  once-per-window communication)
#   proto_class  — 1 (or protos_per_class, via within-class k-means) prototype
#                  per class, à la FedProto; step penalty uses batch prototypes
#   proto_kmeans — k-means (K=num_anchors) refit on the whitened matched pool
#                  at every refresh; step penalty averages the batch under the
#                  window's assignment
anchor_selection: all
num_anchors: 32          # edge anchor budget: subset size (random) / K (proto_kmeans)
protos_per_class: 1      # only used by proto_class
anchor_parseval_normalize: False  # Parseval-prewhiten the selected anchors per side
#epoch_reencode_batch_size: 256
local_steps: 1
update_v_every_n_epochs: 1
warmup_epochs: 0
neighbors: {}
filter_unseen_classes: False
comm_task_coeff: 0.0  # weight for the after-communication task loss (mu; 0 = disabled)
align_on_intersection: False  # if True, filter pilots to intersection of target classes per edge (default: union)

# Which pilot rows an edge's alignment map is fit on (and therefore which rows
# the per-step penalty consumes):
#   none         — every matched pilot. This is what the post-hoc /
#                  non-cooperative baseline does, so the map fit becomes
#                  IDENTICAL to it and the only remaining difference between
#                  the two orchestrators is the sheaf penalty during training.
#   union        — rows whose class is in either endpoint's target_classes
#   intersection — rows whose class is in both
# The misalignment/MRR eval always scores on ALL matched pilots, so anything
# but 'none' fits the map without ever seeing classes it is then scored on.
# Under split_strategy: overlapping_shift that is plainly wrong: target_classes
# marks the OVER-REPRESENTED classes, not the support, so every agent holds
# rows of every class. Measured cost of 'union' there: 770 of 1120 pilots used
# and mean edge residual 0.6155 vs 0.5056 achievable (22% worse).
edge_class_filter: none

# SheafFRL exchanges pilots every step and optimises all losses together, refreshing
# the alignment maps every `update_v_every_n_epochs`. For the decoupled three-phase
# (communication-efficient) variant, use the CESheafFRL orchestrator instead.

# Information-theoretic PID logging (Liang et al. 2023).
# Implemented in BaseOrchestrator → applies to *every* orchestrator that
# forwards **kwargs to super().__init__.  Toggle pid_logging to enable.
pid_logging: True
pid_methods: ['cvxpy']   # ['cvxpy', 'batch'] or any subset.
pid_pairs: neighbors     # 'neighbors' (graph edges) or 'all' (full clique).
pid_num_clusters: 10     # K-Means clusters per view (CVX method).
pid_max_samples: 4000    # Down-sample the training set for the CVX path.
pid_discrim_epochs: 40   # Neural-PID discriminator epochs.
pid_align_epochs: 10     # Neural-PID alignment epochs.
pid_batch_size: 256      # Neural-PID mini-batch size.
pid_hidden_dim: 32
pid_embed_dim: 10
