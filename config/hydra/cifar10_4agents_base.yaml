# Shared base for the 4-agent CIFAR-10 family (not run directly; see cifar10_4agents_<setup>.yaml).
# Everything as in cifar10_5agents_base (shift 1.0, 4096 shared pool pilots, CenterNorm, no
# whitening, class_cover graph, 100 epochs) with 4 agents:
#   0 small ResNet-10, 1 small CNN, 2 small ResNet-18, 3 small CNN (agent 4 of the parent is unused).
defaults:
  - cifar10_5agents_base
  - _self_

study_name: "CIFAR-10 4 agents"
logger:
  project: cifar10_4agents

dataset:
  n_agents: 4

model:
  agents:
    2:   # small ResNet-18 (2 blocks per stage)
      encoder_hidden_dims: [32, 64, 128, 32]
      blocks_per_stage: [2, 2, 2, 2]
      stage_strides: [1, 2, 2, 2]
