# Four distinct CNNs; seven-class overlapping draws, official MNIST test split.
# Pilot sweep: 384, 768, 2048 (all >= largest latent dimension, 384).
defaults:
  - mnist_2agents_7v7
  - _self_
study_name: mnist_4agents_shift
logger:
  project: mnist_4agents_shift
dataset:
  n_agents: 4
  pilot_num_samples: 384
  num_workers: 2
  groups:
    0: {agents: [0], target_classes: [0, 1, 2, 3, 4, 5, 6]}
    1: {agents: [1], target_classes: [3, 4, 5, 6, 7, 8, 9]}
    2: {agents: [2], target_classes: [5, 6, 7, 8, 9, 0, 1]}
    3: {agents: [3], target_classes: [8, 9, 0, 1, 2, 3, 4]}
model:
  agents:
    0: {encoder_hidden_dims: [32, 64, 128]}
    1: {encoder_hidden_dims: [32, 64, 128, 224]}
    2: {encoder_hidden_dims: [32, 96, 256]}
    3: {encoder_hidden_dims: [32, 64, 192, 384]}
orchestrator:
  # Degree 3 versus degree 1: initial 0.03 / 3; explicitly swept in step 3.
  max_lmb: 0.01
