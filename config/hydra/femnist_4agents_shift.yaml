# FEMNIST digits, 4 agents, label shift 1.0 AND style shift, fully connected
# graph (6 edges). Each agent trains on 7 of the 10 digits (the MNIST windows)
# written by its own writers only: no two agents share a writer, and the
# 4096 shared pilots come from a fifth, disjoint group of writers. The test
# set is 10% of every agent's rows (all digits, every agent's styles), the
# same for all agents. Same four CNNs as the MNIST experiment.
defaults:
  - paper_base
  - override dataset: femnist
  - override model: cnn_classifier
  - _self_

logger:
  project: femnist_4agents_shift

sheaf_fmtl_gamma: 1e-3   # SheafFMTL compression, largest that fits RAM: d_ij 129, ~7.8 GB/run

tuned_lmb:   # untuned: the MNIST values
  non_cooperative: 0.0
  sheaf_frl: 0.01
  di_sheaf_frl: 0.01
  comfed: 1.18e-3
  sheaf_fmtl: 0.01
  fedproto: 0.1
  fedmuscle: 0.1
  fedre: 0.0

dataset:
  n_agents: 4
  test_source: pool             # FEMNIST has no official test split
  batch_size: 256
  num_workers: 2
  groups:
    0: {agents: [0], target_classes: [0, 1, 2, 3, 4, 5, 6]}
    1: {agents: [1], target_classes: [3, 4, 5, 6, 7, 8, 9]}
    2: {agents: [2], target_classes: [5, 6, 7, 8, 9, 0, 1]}
    3: {agents: [3], target_classes: [8, 9, 0, 1, 2, 3, 4]}

model:
  agents:
    0: {encoder_hidden_dims: [32, 64, 128]}
    1: {encoder_hidden_dims: [32, 64, 128, 224]}
    2: {encoder_hidden_dims: [32, 96, 256]}
    3: {encoder_hidden_dims: [32, 64, 192, 384]}

hydra:
  sweeper:
    params:
      orchestrator: non_cooperative,sheaf_frl,di_sheaf_frl,comfed,sheaf_fmtl,fedproto,fedmuscle,fedre
      seed: 42,43,44
