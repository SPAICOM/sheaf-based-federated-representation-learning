# SGD + Nesterov momentum with a cosine lr schedule over trainer.max_epochs
# (the `scheduler` key is consumed by BaseOrchestrator.configure_optimizers
# and stripped before the optimizer is instantiated).
_target_: torch.optim.SGD
lr: 0.05
momentum: 0.9
nesterov: true
weight_decay: 5e-4
scheduler: cosine
