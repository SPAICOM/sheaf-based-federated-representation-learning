# Label-scarce left/right halves: agent 0 sees only the left half of each image,
# agent 1 only the right half. Each agent has few labelled images, and both share
# a large pool of pilots that are in neither training set and whose labels are
# never used (the task loss sees only the agents' own labelled rows). Non-coop
# uses the pilots only to fit the post-hoc alignment; SheafFRL also trains on
# them through the sheaf penalty, as a cross-agent multi-view signal.
# Label budget: dataset.agent_train_samples (2000 default; 5000 also calibrated).
defaults:
  - cifar10_2agents_base
  - _self_

study_name: "CIFAR-10 2 agents halves, scarce labels"
logger:
  project: cifar10_2agents_halves_scarce

trainer:
  max_epochs: 300            # 2000 labels -> 16 steps/epoch, 4800 steps in total

dataset:
  shift_strength: 0.0        # uniform labels: the heterogeneity is the view
  agent_train_samples: 2000
  pilot_source: pool         # pilots drawn from the train pool ...
  pilot_exclusive: true      # ... and removed from it, so no agent trains on them
  pilot_num_samples: 20000
  pilot_shuffle: true        # cycle the whole pool across epochs
  agent_input_noise:
    0: {type: mask, region: right, fraction: 0.5}
    1: {type: mask, region: left, fraction: 0.5}

orchestrator:
  # The per-epoch train comm monitor re-encodes 10k test + 20k pilot images,
  # which costs ~25 s/epoch here; run it every 25 epochs (and on the last).
  train_comm_eval_every_n_epochs: 25
