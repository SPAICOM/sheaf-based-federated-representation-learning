defaults:
  - dataset: cifar10
  - model: cnn_classifier
  - orchestrator: sheaf_fmtl
  - optimizer: sgd
  - _self_

seed: 42

agents:
  0:
    encoder_hidden_dims: [16, 32]
  1:
    encoder_hidden_dims: [32, 64]
  2:
    encoder_hidden_dims: [32, 64, 128]
  3:
    encoder_hidden_dims: [64, 128, 256]

graph:
  neighbors_mode: "fully_connected"
  seed: 42
  p: 0.3
  m: 3
  neighbors: {}

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: sheaf-repr-learning__hetero-cifar10
  group: ${study_name}
  name: trial_${hydra:job.num}
  save_dir: logs/
  log_model: false
  reinit: true

trainer:
  max_epochs: 25
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 25

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step

  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: validation/avg_task_performance_epoch
    mode: max
    save_top_k: 1
    save_last: true

  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: validation/avg_task_performance_epoch
    patience: 5
    mode: max

dataset:
  split_strategy: uniform
  n_agents: 4
  batch_size: 128
  num_workers: 4
  mode: min_size
  pilot_split: 0.05
  pilot_batch_size: 64

model:
  encoder_hidden_dims: [32, 64, 128]
  decoder_hidden_dims: [256]
  dropout: 0.1
  use_batchnorm: true

orchestrator:
  gamma: 0.001
  lambda_reg: 0.001
  eta: 0.01

optimization:
  objective_metric: validation/avg_task_performance_epoch
  run_test: true
