defaults:
  - dataset: hetero_mnist
  - model: cnn_classifier
  - orchestrator: sheaf_frl
  - optimizer: sgd
  - _self_

seed: 42
study_name: "HeteroRate MNIST 15 agents"

lmb_study:
  enabled: false
  # efficient: true
  # n_trials: 15
  # n_tune_epochs: 5
  # lmb_low: 1e-4
  # lmb_high: 1e-1

graph:
  neighbors_mode: "class_overlap"
  max_edge_frac: 0.4
  similarity: intersection

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: anchor_selection_sfrl
  group: ${study_name}
  name: anchor_${orchestrator.anchor_selection}_na${orchestrator.num_anchors}_trial_${hydra:job.num}
  save_dir: logs/
  log_model: false

optimizer:
  lr: 1e-2

trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 25
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step

dataset:
  split_strategy: grouped_non_iid
  n_agents: 15
  classes_per_agent: 10
  shift_strength: 0.9
  monitor_test_during_fit: true
  batch_size: 64
  num_workers: 0
  mode: min_size
  pilot_split: 0.1
  # Must stay above the top of the num_anchors sweep (64) below, otherwise
  # random/proto_kmeans have nothing left to subsample from each step (every
  # communication round only ever sees pilot_batch_size pilots, regardless of
  # how large the underlying epoch pilot pool is) and silently collapse to
  # the same behaviour as anchor_selection=all.
  pilot_batch_size: 512
  comm_data: shared_global_pilots
  groups:
    0:
      agents: [0]
      target_classes: [4, 5, 6, 7, 8]
    1:
      agents: [1]
      target_classes: [0, 1, 2, 3, 4]
    2:
      agents: [2]
      target_classes: [0, 1, 2, 3, 4, 5]
    3:
      agents: [3]
      target_classes: [4, 5, 6, 7, 8, 9]
    4:
      agents: [4]
      target_classes: [0, 1, 2, 7, 8, 9]
    5:
      agents: [5]
      target_classes: [2, 3, 4, 5, 6]
    6:
      agents: [6]
      target_classes: [1, 2, 3, 4, 5, 6]
    7:
      agents: [7]
      target_classes: [3, 4, 5, 6, 7]
    8:
      agents: [8]
      target_classes: [0, 2, 4, 6, 8]
    9:
      agents: [9]
      target_classes: [5, 6, 7, 8, 9]
    10:
      agents: [10]
      target_classes: [1, 2, 3, 4, 5]
    11:
      agents: [11]
      target_classes: [0, 1, 2, 8, 9]
    12:
      agents: [12]
      target_classes: [3, 4, 5, 6, 7, 8]
    13:
      agents: [13]
      target_classes: [1, 4, 6, 8, 9]
    14:
      agents: [14]
      target_classes: [0, 1, 2, 3, 7]

model:
  agents:
    0:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 128]
      decoder_hidden_dims: [256, 128, 64]
      dropout: 0.3
      use_batchnorm: true
    1:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 128, 224]
      decoder_hidden_dims: [120]
      dropout: 0.1
      use_batchnorm: true
    2:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [16, 32, 64]
      decoder_hidden_dims: [128]
      dropout: 0.2
      use_batchnorm: true
    3:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [64, 128, 128]
      decoder_hidden_dims: [256, 128]
      dropout: 0.25
      use_batchnorm: true
    4:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 48, 96, 192]
      decoder_hidden_dims: [192, 96]
      dropout: 0.3
      use_batchnorm: true
    5:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [24, 48, 96]
      decoder_hidden_dims: [96]
      dropout: 0.15
      use_batchnorm: true
    6:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 128, 256]
      decoder_hidden_dims: [256]
      dropout: 0.4
      use_batchnorm: true
    7:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [24, 48, 96, 144]
      decoder_hidden_dims: [64, 32]
      dropout: 0.1
      use_batchnorm: true
    8:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [48, 96, 160]
      decoder_hidden_dims: [160, 80]
      dropout: 0.2
      use_batchnorm: true
    9:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 80]
      decoder_hidden_dims: [100]
      dropout: 0.05
      use_batchnorm: true
    10:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [40, 80, 120]
      decoder_hidden_dims: [120, 60]
      dropout: 0.2
      use_batchnorm: true
    11:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [48, 96, 192, 240]
      decoder_hidden_dims: [256, 128]
      dropout: 0.2
      use_batchnorm: true
    12:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [20, 40, 60, 80]
      decoder_hidden_dims: [80]
      dropout: 0.2
      use_batchnorm: true
    13:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 96]
      decoder_hidden_dims: [192, 96]
      dropout: 0.25
      use_batchnorm: true
    14:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [56, 112, 160]
      decoder_hidden_dims: [128]
      dropout: 0.1
      use_batchnorm: true

orchestrator:
  pid_logging: false
  log_latent_diagnostics: true
  # Sheaf FRL specific
  warmup_epochs: 0
  use_general_maps: false
  soft_maps: false
  align_on_intersection: false
  learn_whitening: true
  gamma: 1e-3
  eta: 0.01
  # Post-training alignment
  alignment_method: procrustes
  max_lmb: 1e-2
  learn_lmb: false
  dual_rho: null
  comm_task_coeff: 0

optimization:
  objective_metric: validation/avg_task_performance_epoch
  run_test: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      orchestrator: non_cooperative
      orchestrator.alignment_method: procrustes
      orchestrator.num_anchors: 512, 1024
      orchestrator.anchor_selection: proto_kmeans, random
