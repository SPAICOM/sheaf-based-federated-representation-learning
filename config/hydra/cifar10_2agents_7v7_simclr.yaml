# cifar10_2agents_7v7 (clean inputs, classes 0-6 vs 3-9, shift 1.0) + a local SimCLR
# term on every agent: NT-Xent on two GPU-augmented views of the step's training
# batch AND unlabelled pilot batch (src/utils/simclr.py, BaseOrchestrator._local_simclr_loss),
# identical for non-coop and DiSheafFRL. Tests whether the sheaf penalty on the pilots,
# propagated through the contrastive term to the training latents, widens the gap
# with non-coop and, for once, lifts PRIVATE accuracy.
# Data/latent settings = the LEDGER 7v7 shift-study recipe at its picked pilot count:
# CenterNorm, 4096 shared pilots over all classes (removed from training), no post-hoc
# whitening. Reference without SimCLR: non-coop x5yik4aa, DiSheafFRL 38c47yen.
#   orchestrator=non_cooperative | orchestrator=di_sheaf_frl orchestrator.whitening=false orchestrator.max_lmb=3e-2
defaults:
  - cifar10_2agents_7v7
  - _self_

study_name: "CIFAR-10 2 agents clean 7v7 + SimCLR"
logger:
  project: cifar10_2agents_7v7_simclr

model:
  latent_norm: true

dataset:
  pilot_source: pool
  pilot_exclusive: true
  pilot_class_filter: false
  pilot_num_samples: 4096

orchestrator:
  posthoc_whitening: false
  simclr_weight: 1.0
  simclr_temperature: 0.5
  simclr_sources: [train, pilots]
  simclr_proj_dim: 128
  simclr_hidden_dim: 512
