# Shared base for the 5-agent CIFAR-10 study (not run directly; see the setup configs
# cifar10_5agents_<setup>.yaml, which set the class split and the wandb project).
# Carries over what made DiSheafFRL beat non-coop in the 2-agent 7v7 studies
# (LEDGER rows cifar10_2agents_7v7*, cifar10_2agents_7v7_bottleneck):
#   * label shift 1.0 (each agent sees only its target classes; no gain at <= 0.8)
#   * shared unlabeled pilots over all classes, removed from training (pool, exclusive)
#     -> the DiSheafFRL penalty during training and the post-hoc Procrustes for non-coop
#   * CenterNorm latents, no whitening (training and post-hoc)
#   * small heterogeneous encoders with a narrow latent d (bottleneck), the same d at
#     every agent (square restriction maps). Default d=32; override per run.
# Graph: neighbors_mode class_cover -> edge (i, j) iff C_i | C_j = all 10 classes.
defaults:
  - dataset: hetero_cifar10
  - model: resnet_classifier
  - orchestrator: non_cooperative
  - optimizer: sgd_cosine
  - _self_

seed: 42
study_name: "CIFAR-10 5 agents"

lmb_study:
  enabled: false
  efficient: false
  sampler: grid
  objective: comm
  n_trials: 5
  n_tune_epochs: 20
  lmb_low: 1e-3
  lmb_high: 1e-1
  val_split: 0.1

graph:
  neighbors_mode: class_cover

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: cifar10_5agents
  group: ${study_name}
  save_dir: logs/
  log_model: false

trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 50
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch

dataset:
  split_strategy: overlapping_shift
  test_source: original
  n_agents: 5
  shift_strength: 1.0
  agent_train_samples: max
  val_split: 0.0
  monitor_test_during_fit: true
  batch_size: 128
  num_workers: 1             # 5 agents x loaders per job; RAM is the limit with parallel jobs
  mode: min_size
  pilot_split: 0.0
  pilot_source: pool
  pilot_exclusive: true
  pilot_class_filter: false
  pilot_num_samples: 4096    # largest DiSheafFRL-non-coop gap in the 7v7 pilot sweep
  pilot_batch_size: 128
  comm_data: shared_global_pilots
  agent_input_noise: null

model:
  latent_norm: true          # CenterNorm
  decoder_hidden_dims: [256]
  dropout: 0.0
  weight_decay: 0.0          # L2 already applied by the optimizer (5e-4)
  # Small encoders of the clean 7v7 bottleneck study; only the last layer has width d.
  agents:
    0:   # small ResNet-10
      encoder_hidden_dims: [32, 64, 128, 32]
      blocks_per_stage: [1, 1, 1, 1]
      stage_strides: [1, 2, 2, 2]
    1:   # small VGG-style CNN
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 32, 64, 64, 128, 32]
      pool_blocks: [false, true, false, true, false, true]
      use_batchnorm: true
    2:   # small ResNet-10
      encoder_hidden_dims: [32, 64, 128, 32]
      blocks_per_stage: [1, 1, 1, 1]
      stage_strides: [1, 2, 2, 2]
    3:   # small VGG-style CNN
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 32, 64, 64, 128, 32]
      pool_blocks: [false, true, false, true, false, true]
      use_batchnorm: true
    4:   # small ResNet-18 (2 blocks per stage)
      encoder_hidden_dims: [32, 64, 128, 32]
      blocks_per_stage: [2, 2, 2, 2]
      stage_strides: [1, 2, 2, 2]

orchestrator:
  pid_logging: false
  log_latent_diagnostics: true
  alignment_method: procrustes
  posthoc_whitening: false
  max_lmb: 1.5e-2            # DiSheafFRL only: 3e-2 (2-agent best) / mean degree 2
  learn_lmb: false
  comm_task_coeff: 0
  whitening_source: pilots

optimization:
  objective_metric: validation/avg_task_performance_epoch
  run_test: true
