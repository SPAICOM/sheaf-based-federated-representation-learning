# FashionMNIST, 4 heterogeneous agents, shift 1.0 (classes not seen by an
# agent never appear in its training data), non-cooperative (independent
# training + post-hoc Procrustes alignment) vs DiSheafFRL (directed,
# confidence-gated sheaf penalty), swept over the shared pilot budget.
#
# Classes: 6 of 10 per agent, EVERY pair sharing exactly 3 classes (derived
# below) — this is the flattest overlap a 4-agent layout on 10 classes can
# have, so no edge is near-disjoint and none is near-identical. A uniform
# overlap of 3 is only possible at 6 classes/agent: two k-of-10 class sets
# overlap in at least 2k-10 classes, so k=7 (as in the 2-agent 0-6/3-9 setup,
# cap 0.7) can never go below an overlap of 4. At k=6 the private-accuracy
# cap is 6/10 = 0.6.
#
# Construction: map the 10 classes to the 10 edges of K5 on vertices
# {1,2,3,4,5}; agent v's classes are the edges NOT touching vertex v (6
# edges among the other 4 vertices), for v in {1,2,3,4} (vertex 5 unused).
# Two such agent sets share exactly the edges avoiding BOTH v and w, i.e.
# the 10-4-4+1=3 edges among the remaining 3 vertices — exactly 3, always.
# Per-class coverage: 4 classes held by 3 agents (the "triangle" edges on
# {2,3,4}/{1,3,4}/{1,2,4}/{1,2,3} depending on labelling), 6 classes held
# by 2 agents; no class is held by only 1 or by all 4.
#
# Data (overlapping_shift, test_source: original):
#   * test   = the full official FashionMNIST test split (10,000 images),
#              the SAME set for every agent
#   * pilots = dataset.pilot_num_samples rows drawn uniformly from the
#              official train split (pilot_source: pool), excluded from every
#              agent's training draw (pilot_exclusive: true) and NOT filtered
#              to an agent's own classes (pilot_class_filter: false) — the
#              pilots cover all 10 classes and are identical across methods
#              and across the pilot-budget sweep's seeds
#   * train  = each agent draws only from its own 6 target classes
#              (shift_strength: 1.0) out of (train split - pilots);
#              agent_train_samples: max -> largest feasible draw
#
# Architectures: the cifar10_4agents_shift ResNets with the last stage width
# halved (latent dim halved): d=256/192/128/160 for agents 0-3. CenterNorm at
# the bottleneck (model.latent_norm: true); whitening OFF everywhere
# (orchestrator.whitening / posthoc_whitening: false) for both methods.
#
# Lambda: FIXED at orchestrator.max_lmb below (lmb_study.enabled: false) for
# every pilot budget, tuned on a 2-agent version of this setup (2048 pilots,
# 6-point log grid on [1e-4, 1], harmonic objective).
#
# Orchestrator: set at launch, orchestrator=non_cooperative | di_sheaf_frl.
# Sweep pilots with dataset.pilot_num_samples (see scripts/
# run_fashionmnist_4agents_shift_sweep.sh for the 4 budgets x 2 methods x 3
# seeds = 24 runs).
defaults:
  - cifar10_2agents_base
  - override dataset: hetero_fashion_mnist
  - _self_

seed: 42
study_name: "FashionMNIST 4 agents shift 1.0 x pilots (non-coop vs DiSheafFRL)"

# orchestrator defaults to non_cooperative (inherited from cifar10_2agents_base);
# pass orchestrator=di_sheaf_frl on the command line for the other method.

lmb_study:
  enabled: false

graph:
  neighbors_mode: "fully_connected"   # 4 agents -> 6 edges

logger:
  # Personal team: mle-spaicom (the default entity) rejects project creation
  # (403 on a brand-new project name) for this API key.
  entity: leonardo-dinino-sapienza-universit-di-roma
  project: fashionmnist_4agents_shift

dataset:
  n_agents: 4
  shift_strength: 1.0
  pilot_source: pool
  pilot_exclusive: true
  pilot_class_filter: false
  pilot_num_samples: 2048   # swept: 384, 768, 2048, 4096
  pilot_batch_size: 128     # <= the smallest swept budget (384)
  groups:
    0:
      agents: [0]
      target_classes: [4, 5, 6, 7, 8, 9]
    1:
      agents: [1]
      target_classes: [1, 2, 3, 7, 8, 9]
    2:
      agents: [2]
      target_classes: [0, 2, 3, 5, 6, 9]
    3:
      agents: [3]
      target_classes: [0, 1, 3, 4, 6, 8]

model:
  decoder_hidden_dims: [256]
  latent_norm: true   # CenterNorm at the bottleneck
  agents:
    0:   # ResNet-10, 4 stages x 1 block, last stage halved, d=256
      encoder_hidden_dims: [64, 128, 256, 256]
      blocks_per_stage: [1, 1, 1, 1]
      stage_strides: [1, 2, 2, 2]
    1:   # 4 stages x 1 block, last stage halved, d=192
      encoder_hidden_dims: [64, 128, 256, 192]
      blocks_per_stage: [1, 1, 1, 1]
      stage_strides: [1, 2, 2, 2]
    2:   # 3 stages x 2 blocks, last stage halved, d=128
      encoder_hidden_dims: [64, 128, 128]
      blocks_per_stage: [2, 2, 2]
      stage_strides: [1, 2, 2]
    3:   # 3 stages, 1-2-2 blocks, last stage halved, d=160
      encoder_hidden_dims: [64, 128, 160]
      blocks_per_stage: [1, 2, 2]
      stage_strides: [1, 2, 2]

orchestrator:
  whitening: false            # off everywhere (DiSheafFRL's SWBN/ZCA path)
  posthoc_whitening: false    # off everywhere (post-hoc eval, both methods)
  alignment_method: procrustes
  max_lmb: 3.981071705534973e-3   # fixed for every pilot budget; tuned on a
                                  # 2-agent version of this setup (2048
                                  # pilots, 6-point log grid on [1e-4, 1],
                                  # harmonic objective)
  learn_lmb: false
  gate_score: zlogit          # DiSheafFRL only; ignored by non_cooperative
  gate_temperature: 0.1       # DiSheafFRL only; ignored by non_cooperative
