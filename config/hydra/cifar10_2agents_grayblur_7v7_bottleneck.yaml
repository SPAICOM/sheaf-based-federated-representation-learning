# Bottleneck study on the 7v7 grayscale/blur setup (agent 0 classes 0-6 in grayscale,
# agent 1 classes 3-9 blurred, full 10-class test split, cap 0.7): how non-coop and
# DiSheafFRL (λ=1e-2) behave as the edge dimension shrinks. For a bottleneck d agent 0
# has latent dim d and agent 1 d/2, obtained purely architecturally: the two ResNets keep
# their backbone and either narrow the last stage or funnel down to d with extra stride-1
# residual stages. The per-d encoder lists are set on the command line by
# tmp/2026-11-06_7v7_bottleneck.sh; with no override this is the d=512 setup
# (= cifar10_2agents_grayblur_7v7 runs qt7wgve3 / um0kel4a).
# 2048 shared unlabeled pilots over all classes (removed from training), CenterNorm,
# no whitening.
defaults:
  - cifar10_2agents_grayblur_7v7
  - _self_

study_name: "CIFAR-10 2 agents grayscale vs blur 7v7, bottleneck sweep"
logger:
  project: cifar10_2agents_grayblur_7v7_bottleneck

trainer:
  max_epochs: 100

dataset:
  num_workers: 4
  pilot_source: pool
  pilot_exclusive: true
  pilot_class_filter: false
  pilot_num_samples: 2048

model:
  latent_norm: true

orchestrator:
  posthoc_whitening: false
  max_lmb: 1e-2
