# Two MNIST agents with private label noise, no label shift.
#   * train  = each agent draws agent_train_samples rows uniformly from the
#              official train split (draws overlap; shift_strength 0)
#   * pilots = pilot_num_samples rows uniform over the same train split; they
#              may also sit in the agents' training sets (pilot_exclusive: false)
#   * test   = the full official test split, same 10k rows for both agents
#   * label noise (training rows only): agent 0 swaps 4 <-> 7 on a fraction p of
#     its 4s and 7s, agent 1 swaps 3 <-> 5 (dataset.agent_label_noise)
# Models: agents 0 and 1 of multiagent_mnist_shift_overlap.
defaults:
  - dataset: hetero_mnist
  - model: cnn_classifier
  - orchestrator: sheaf_frl
  - optimizer: sgd
  - _self_

seed: 42
study_name: "MNIST 2 agents, label noise 4-7 vs 3-5"

graph:
  neighbors_mode: "fully_connected"

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: mnist_2agents_labelnoise
  group: ${study_name}
  save_dir: logs/
  log_model: false

optimizer:
  lr: 1e-2

trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 25
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch

dataset:
  split_strategy: overlapping_shift
  n_agents: 2
  shift_strength: 0.0
  test_source: original
  pilot_source: pool
  pilot_exclusive: false
  pilot_num_samples: 2048
  pilot_batch_size: 384
  pilot_split: 0.0
  agent_train_samples: 8000
  val_split: 0.0
  monitor_test_during_fit: true
  batch_size: 64
  num_workers: 0
  mode: min_size
  comm_data: shared_global_pilots
  groups:       # target classes are irrelevant at shift 0; listed for the noisy pair
    0: {agents: [0], target_classes: [4, 7]}
    1: {agents: [1], target_classes: [3, 5]}
  agent_label_noise:
    0: {classes: [4, 7], fraction: 0.4, direction: swap}   # swap: a <-> b | one_way: a -> b
    1: {classes: [3, 5], fraction: 0.4, direction: swap}

model:
  agents:
    0:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 128]
      decoder_hidden_dims: [256, 128, 64]
      dropout: 0.3
      use_batchnorm: true
    1:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64, 128, 224]
      decoder_hidden_dims: [120]
      dropout: 0.1
      use_batchnorm: true

orchestrator:
  pid_logging: false
  log_latent_diagnostics: true
  alignment_method: procrustes
  learn_whitening: true
  max_lmb: 0
  learn_lmb: false
  comm_task_coeff: 0
  whitening_source: pilots
  swbn_fit_source: pilots
  zca_refit_source: pilots

optimization:
  objective_metric: validation/avg_task_performance_epoch
  run_test: true
