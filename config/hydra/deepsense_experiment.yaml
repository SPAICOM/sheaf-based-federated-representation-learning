defaults:
  - dataset: deepsense
  - model: cnn_classifier
  - orchestrator: non_cooperative
  - optimizer: adam
  - _self_

seed: 42

graph:
  neighbors_mode: "fully_connected"
  seed: 42
  p: 0.3
  m: 3

model:
  output_dim: 64
  decoder_hidden_dims: [256]
  dropout: 0.1
  use_batchnorm: true
  # Per-modality overrides: keys are modality indices (0=RGB, 1=mmWave, 2=LiDAR).
  # Any key omitted here falls back to the global values above.
  per_modality:
    0:  # RGB (3, 64, 64)
      output_dim: 128
      decoder_hidden_dims: [512, 256]
    1:  # mmWave (1, 16, 64)
      output_dim: 64
      decoder_hidden_dims: [256]
    2:  # LiDAR (2, 32, 32)
      output_dim: 64
      decoder_hidden_dims: [128]

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: sheaf-repr-learning__deepsense
  name: ${now:%Y-%m-%d}_${now:%H-%M-%S}
  save_dir: logs/
  log_model: false
  reinit: true

trainer:
  max_epochs: 5
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 10

callbacks:
  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: validation/global_task_performance_epoch
    mode: max
    save_top_k: 1
    save_last: true

  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: validation/global_task_performance_epoch
    patience: 10
    mode: max
