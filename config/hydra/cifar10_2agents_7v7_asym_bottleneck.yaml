# Digits-report-like bottleneck study (refs/Report.pdf): only ONE agent is bottlenecked.
# Same as cifar10_2agents_7v7_bottleneck (clean 7v7, 2048 shared pilots, CenterNorm, no
# whitening, λ tuned per d by lmb_study) except that agent 0 (small ResNet-10) keeps a fixed
# 64-dim latent and only agent 1 (small VGG-style CNN) has the bottleneck d (its last conv's
# width). The two latents then differ in size: restriction maps / post-hoc maps are
# rectangular. Tests whether training-time alignment helps the narrow agent of an unequal
# pair, where the symmetric sweep (both agents at d) showed no gain at small d.
# The per-d lists are set on the command line by tmp/2026-11-07_7v7_asym_bottleneck.sh;
# with no override agent 1 has d=8.
defaults:
  - cifar10_2agents_7v7_bottleneck
  - _self_

study_name: "CIFAR-10 2 agents clean 7v7, ResNet(64) vs CNN(d), one-sided bottleneck"
logger:
  project: cifar10_2agents_7v7_asym_bottleneck

model:
  agents:
    1:   # only this agent's bottleneck varies
      encoder_hidden_dims: [32, 32, 64, 64, 128, 8]
