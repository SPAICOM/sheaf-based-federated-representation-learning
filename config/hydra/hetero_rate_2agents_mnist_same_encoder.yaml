defaults:
  - dataset: hetero_mnist
  - model: cnn_classifier
  - orchestrator: fedper
  - optimizer: sgd
  - _self_

seed: 42
study_name: "HeteroRate MNIST 2 agents"

lmb_study:
  enabled: true        # set to true to run Optuna search before the full training run
  n_trials: 15          # number of Optuna trials
  n_tune_epochs: 5      # epochs per trial
  lmb_low: 1.0e-4       # lower bound of the log-uniform search interval
  lmb_high: 10.0        # upper bound of the log-uniform search interval

graph:
  neighbors_mode: "fully_connected"
  seed: 42
  p: 0.15
  m: 3
  neighbors: {}

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: thursday_presentation_same_encoder
  group: ${study_name}
  name: ${hydra:runtime.choices.orchestrator}_trial_${hydra:job.num}
  save_dir: logs/
  log_model: false

trainer:
  max_epochs: 20
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 25

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step

dataset:
  split_strategy: grouped_non_iid
  n_agents: 2
  classes_per_agent: 10
  shift_strength: 0.6
  monitor_test_during_fit: true
  batch_size: 64
  num_workers: 0
  mode: min_size
  pilot_split: 0.1
  pilot_batch_size: 64
  comm_data: shared_global_pilots
  groups:
    0:
      agents: [0]
      target_classes: [4, 5, 6, 7, 8, 9]
    1:
      agents: [1]
      target_classes: [0, 1, 2, 3, 4, 5]

model:
  agents:
    0:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64]
      decoder_hidden_dims: [256, 128, 64]
      dropout: 0.3
      use_batchnorm: true
    1:
      _target_: src.agents.CNNClassifier
      encoder_hidden_dims: [32, 64]
      decoder_hidden_dims: [120]
      dropout: 0.1
      use_batchnorm: true
    # 1:
    #   _target_: src.agents.TransformerClassifier
    #   patch_size: 7
    #   embed_dim: 128
    #   depth: 4
    #   num_heads: 4
    #   mlp_ratio: 4.0
    #   pool: mean
    #   decoder_hidden_dims: [256]
    #   dropout: 0.1
    #   weight_decay: 1e-4
    #   use_batchnorm: false

orchestrator:
  parseval_normalization: false
  l2_normalization: false
  use_prototypes: false
  log_latent_diagnostics: true
  # Used by Sheaf FRL, Sheaf FMTL, ComFed, FedProto and FedMuscle --> I need model-specific tuning for this
  max_lmb: 1e-2
  lambda_schedule: null
  # Sheaf FRL specific
  warmup_epochs: 0 # just for sheaf_frl
  comm_task_coeff: 1
  use_general_maps: false
  soft_maps: false
  align_on_intersection: false
  # Sheaf FMTL specific
  gamma: 0.001
  eta: 0.01
  # Post-training alignment (for methods not working on representations)
  alignment_method: procrustes # can be "general" or "procrustes"

optimization:
  objective_metric: validation/avg_task_performance_epoch
  run_test: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      # orchestrator.alignment_method: general, procrustes
      # orchestrator.use_general_maps: false, true
      # orchestrator.max_lmb: 0.5, 5
      # orchestrator: sheaf_fmtl, comfed, fedper, sheaf_frl, non_cooperative
      # dataset.shift_strength: 0.6, 0.8, 1.0

