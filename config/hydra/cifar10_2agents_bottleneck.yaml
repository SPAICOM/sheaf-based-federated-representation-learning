# CIFAR-10, 2 agents, label shift 1.0: performance vs bottleneck dimension.
# Agent 0 trains on classes 0-6, agent 1 on 3-9 (clean images, private cap 0.7).
# Two different ResNets whose latent widths are d and d/2; the pair is picked
# with the bottleneck group: d8 (8/4), d16 (16/8), ..., d256 (256/128).
# 1024 shared pilots over all classes.
# `just bottleneck-pipeline cifar10` trains every method x d x seed at tuned_lmb.
defaults:
  - paper_base
  - bottleneck: d64
  - override dataset: hetero_cifar10
  - override model: resnet_classifier
  - _self_

logger:
  project: cifar10_2agents_bottleneck

tuned_lmb:   # best lambda of the cifar10_4agents_full pipeline (seed-42 grid, K4 graph)
  non_cooperative: 0.0
  sheaf_frl: 3e-2
  di_sheaf_frl: 1.2e-1
  comfed: 0.03
  sheaf_fmtl: 0.01
  fedproto: 0.1
  fedmuscle: 1
  fedre: 0.0

lmb_tuning:
  fixed: [sheaf_frl, di_sheaf_frl, comfed, sheaf_fmtl, fedproto, fedmuscle]

dataset:
  n_agents: 2
  pilot_num_samples: 1024
  groups:
    0: {agents: [0], target_classes: [0, 1, 2, 3, 4, 5, 6]}
    1: {agents: [1], target_classes: [3, 4, 5, 6, 7, 8, 9]}

hydra:
  sweeper:
    params:
      orchestrator: non_cooperative,sheaf_frl,di_sheaf_frl,comfed,sheaf_fmtl,fedproto,fedmuscle,fedre
      bottleneck: d8,d16,d32,d64,d128,d256
      seed: 42,43,44
