# MFeat MLP classifier — shared decoder defaults.
# Per-agent encoder settings (input_dim, hidden_dims, output_dim,
# encoder_dropout) live under model.agents in the main experiment yaml.

# Decoder (MLP head shared across agents)
decoder_hidden_dims: [256]
dropout: 0.1
use_batchnorm: true

# Latent regularization (PersonalizedClassifier)
l1_reg: 0.0
sparsity_type: l1            # l1 | sae-l1 | l21
