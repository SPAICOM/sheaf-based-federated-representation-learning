# Clean-input control of cifar10_2agents_grayblur_7v7: same class sets (agent 0 trains
# on classes 0-6, agent 1 on 3-9, shared 3-6) and same two ResNets, but neither agent's
# images are corrupted (no grayscale, no blur). Isolates label shift + architecture
# heterogeneity from input-noise heterogeneity. Test = full 10-class split (cap 0.7).
defaults:
  - cifar10_2agents_base
  - _self_

study_name: "CIFAR-10 2 agents clean inputs, classes 0-6 vs 3-9"
logger:
  project: cifar10_2agents_7v7

trainer:
  max_epochs: 100

dataset:
  shift_strength: 1.0
  agent_input_noise: null
  groups:
    0:
      agents: [0]
      target_classes: [0, 1, 2, 3, 4, 5, 6]
    1:
      agents: [1]
      target_classes: [3, 4, 5, 6, 7, 8, 9]
