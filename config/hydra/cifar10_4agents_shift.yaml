# Step 3 of the CIFAR-10 study: 4 heterogeneous agents, SheafFRL vs
# non-cooperative (independent training + post-hoc Procrustes alignment).
#
# Data (overlapping_shift, test_source: original):
#   * test   = the official CIFAR-10 test split, all 10,000 images, the SAME
#              set for every agent; never touched by the dispatching policy
#   * pilots = pilot_num_samples rows drawn uniformly from the official train
#              split, shared by all agents (same ids), excluded from every
#              agent's training draw (pilot_exclusive)
#   * train  = each agent independently draws from (train split - pilots)
#              with P_i(y) = s*Unif{C_i} + (1-s)*Unif{all 10}; draws overlap
#              across agents. agent_train_samples: max -> largest feasible
#              draw, so it shrinks with s: ~34k rows/agent at s=0.2, ~17k at 0.8
#
# Comparison is whitening-matched: SheafFRL learns SWBN whitening on pilots,
# non_cooperative whitens post hoc on the same pilots (whitening_source:
# pilots in orchestrator/non_cooperative.yaml).
defaults:
  - dataset: hetero_cifar10
  - model: resnet_classifier
  - orchestrator: sheaf_frl
  - optimizer: sgd_cosine
  - _self_

seed: 42
study_name: "CIFAR-10 4 agents shift x pilots (overlapping draws, original test split)"

# lambda: 10-point log grid on [1e-4, 1], each point trained for
# n_tune_epochs on ALL agents, ranked by the network-wide post-communication
# accuracy (avg_comm_task_perf over every agent/edge). Scored on a study-only
# holdout (val_split of each agent's own draw); the final run then retrains
# on the full draw with the winning lambda. Runs inside every SheafFRL job
# (non_cooperative has no lambda and skips it).
lmb_study:
  enabled: true
  efficient: false      # whole network, not the first edge only
  sampler: grid
  objective: comm
  n_trials: 10
  n_tune_epochs: 10
  lmb_low: 1e-4
  lmb_high: 1
  val_split: 0.1

graph:
  neighbors_mode: "fully_connected"   # 4 agents -> 6 edges, degree 3

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: cifar10_4agents_shift
  group: ${study_name}
  save_dir: logs/
  log_model: false

trainer:
  max_epochs: 60
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 50
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch

dataset:
  split_strategy: overlapping_shift
  test_source: original
  n_agents: 4
  shift_strength: 0.2
  agent_train_samples: max
  val_split: 0.0
  monitor_test_during_fit: true
  batch_size: 128
  num_workers: 8
  mode: min_size
  pilot_split: 0.0
  pilot_num_samples: 256     # swept below
  pilot_batch_size: 128      # self-clamps to the pool when it is smaller
  pilot_exclusive: true
  comm_data: shared_global_pilots
  # 3 target classes each; adjacent agents share one class (2 and 7), the
  # pairs (0,2), (0,3), (1,2), (1,3) share none.
  groups:
    0:
      agents: [0]
      target_classes: [0, 1, 2]
    1:
      agents: [1]
      target_classes: [2, 3, 4]
    2:
      agents: [2]
      target_classes: [5, 6, 7]
    3:
      agents: [3]
      target_classes: [7, 8, 9]

# Four CIFAR ResNets, all "conv encoder -> global avg pool -> latent -> MLP
# decoder", differing in depth and latent width (latent = last stage width).
model:
  decoder_hidden_dims: [256]
  dropout: 0.0
  weight_decay: 0.0          # L2 already applied by the optimizer (5e-4)
  agents:
    0:   # ResNet-10, 4 stages x 1 block, d=512 (the step-1 model)
      encoder_hidden_dims: [64, 128, 256, 512]
      blocks_per_stage: [1, 1, 1, 1]
      stage_strides: [1, 2, 2, 2]
    1:   # 4 stages x 1 block, narrower last stage, d=384
      encoder_hidden_dims: [64, 128, 256, 384]
      blocks_per_stage: [1, 1, 1, 1]
      stage_strides: [1, 2, 2, 2]
    2:   # 3 stages x 2 blocks, d=256
      encoder_hidden_dims: [64, 128, 256]
      blocks_per_stage: [2, 2, 2]
      stage_strides: [1, 2, 2]
    3:   # 3 stages, 1-2-2 blocks, d=320
      encoder_hidden_dims: [64, 128, 320]
      blocks_per_stage: [1, 2, 2]
      stage_strides: [1, 2, 2]

orchestrator:
  pid_logging: false
  log_latent_diagnostics: true
  warmup_epochs: 0
  use_general_maps: false
  soft_maps: false
  align_on_intersection: false
  learn_whitening: true      # SWBN on pilots <-> non_coop whitening_source: pilots
  alignment_method: procrustes
  max_lmb: 1e-2              # overwritten by lmb_study for SheafFRL
  learn_lmb: false
  dual_rho: null
  comm_task_coeff: 0

optimization:
  objective_metric: validation/avg_task_performance_epoch
  run_test: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      # single seed (42): 2 methods x 2 shifts x 3 pilot budgets = 12 jobs
      orchestrator: sheaf_frl, non_cooperative
      dataset.shift_strength: 0.2, 0.8
      dataset.pilot_num_samples: 128, 256, 2048
