# Grayscale vs harsh blur (as grayblur_harsh) with overlapping class sets:
# agent 0 trains only on classes 0-6, agent 1 only on 3-9 (shift 1), so they share
# classes 3-6. Pilots = images both agents hold = shared-class images only.
# Test stays the full 10-class split: private and comm are capped at 0.7.
defaults:
  - cifar10_2agents_grayblur_harsh
  - _self_

study_name: "CIFAR-10 2 agents grayscale vs blur, classes 0-6 vs 3-9"
logger:
  project: cifar10_2agents_grayblur_7v7

dataset:
  shift_strength: 1.0
  groups:
    0:
      agents: [0]
      target_classes: [0, 1, 2, 3, 4, 5, 6]
    1:
      agents: [1]
      target_classes: [3, 4, 5, 6, 7, 8, 9]
