# 5 agents on a ring induced by class cover: every agent misses 3 of the 10 classes
# (trains on 7, like 7v7), two agents are linked iff together they hold all 10 classes.
# Missing sets M_i: neighbours miss disjoint sets (union = 10 classes -> edge), the two
# non-neighbours of each agent share one missing class with it (-> no edge):
#   M_0={0,3,5} M_1={1,4,6} M_2={0,2,7} M_3={1,3,8} M_4={2,4,9}
#   -> ring 0-1-2-3-4-0, 5/10 edges, degree 2; neighbours share 4 classes (as in 7v7).
# Edges: 0-1, 2-3 ResNet-CNN; 1-2, 3-4 CNN-ResNet; 4-0 ResNet18-ResNet10.
# Tests whether the 2-agent DiSheafFRL gain at shift 1.0 survives on a sparse graph.
defaults:
  - cifar10_5agents_base
  - _self_

study_name: "CIFAR-10 5 agents ring (class cover), shift 1.0"
logger:
  project: cifar10_5agents_ring

dataset:
  groups:
    0:
      agents: [0]
      target_classes: [1, 2, 4, 6, 7, 8, 9]
    1:
      agents: [1]
      target_classes: [0, 2, 3, 5, 7, 8, 9]
    2:
      agents: [2]
      target_classes: [1, 3, 4, 5, 6, 8, 9]
    3:
      agents: [3]
      target_classes: [0, 2, 4, 5, 6, 7, 9]
    4:
      agents: [4]
      target_classes: [0, 1, 3, 5, 6, 7, 8]
