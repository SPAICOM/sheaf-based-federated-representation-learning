_target_: src.datamodules.MHealthDataModule

data_path: ./data/MHealth
gdrive_file_id: 1HJnlZq_vVG-CFhfVhQdQsP7fUBocD3un

split_strategy: subject
n_agents: 5

feature_groups:
  - chest
  - left_ankle
  - right_wrist

# One unique sensor modality per agent (8 modalities, 8 subjects).
# Agent 6 is assigned the ECG modality (2-channel: lead1 + lead2).
agent_modalities:
  0: acc_ankle
  1: gyro_ankle
  # 2: mag_ankle
  2: acc_wrist
  3: gyro_wrist
  # 5: mag_wrist
  4: acc_chest
  # 7: ecg

exclude_null_activity: true
window_size: null
stride: 1

batch_size: 64
num_workers: 0
mode: min_size

val_split: 0.1
test_split: 0.1
pilot_split: 0.1
pilot_num_samples: null
comm_data: shared_global_pilots
seed: 42
