# Steps 1-2 of the CIFAR-10 study: ONE agent, no communication.
#   step 1: shift 0   -> calibrate the architecture to ~0.9 test accuracy
#   step 2: shift 0.2 / 0.5 / 0.8 -> how test accuracy degrades with shift
#
# Data (overlapping_shift, test_source: original):
#   * test  = the official CIFAR-10 test split, all 10,000 images, unshifted
#             and never touched by the dispatching policy
#   * train = drawn from the official 50k train split with
#             P(y) = s*Unif{target_classes} + (1-s)*Unif{all 10}
#   * agent_train_samples: max -> the largest draw the shift allows, so the
#     training set shrinks naturally with s: ~50.0k at s=0, ~34.1k at 0.2,
#     ~23.1k at 0.5, ~17.4k at 0.8 (3 target classes, ~5k images per class)
defaults:
  - dataset: hetero_cifar10
  - model: resnet_classifier
  - orchestrator: non_cooperative
  - optimizer: sgd_cosine
  - _self_

seed: 42
study_name: "CIFAR-10 single agent (overlapping draws, original test split)"

lmb_study:
  enabled: false

graph:
  neighbors_mode: "fully_connected"

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: cifar10_single_agent
  group: ${study_name}
  save_dir: logs/
  log_model: false

trainer:
  max_epochs: 60
  accelerator: auto
  devices: 1
  deterministic: true
  num_sanity_val_steps: 2
  log_every_n_steps: 50
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch

dataset:
  split_strategy: overlapping_shift
  test_source: original
  n_agents: 1
  shift_strength: 0.0
  agent_train_samples: max
  val_split: 0.0
  monitor_test_during_fit: true
  batch_size: 128
  num_workers: 8
  mode: min_size
  pilot_split: 0.0
  pilot_num_samples: 0       # one agent: no edges, so no pilots
  pilot_exclusive: true
  comm_data: shared_global_pilots
  groups:
    0:
      agents: [0]
      target_classes: [0, 1, 2]

# ResNet-10 for CIFAR: 3x3 stem, 4 stages x 1 basic block (64-128-256-512),
# global average pool -> 512-d latent (the encoder/decoder cut), then an MLP
# decoder 512 -> 256 -> 10. ~5.0M parameters.
model:
  encoder_hidden_dims: [64, 128, 256, 512]
  blocks_per_stage: [1, 1, 1, 1]
  stage_strides: [1, 2, 2, 2]
  decoder_hidden_dims: [256]
  dropout: 0.0
  weight_decay: 0.0          # L2 already applied by the optimizer (5e-4)

orchestrator:
  pid_logging: false
  log_latent_diagnostics: false
  alignment_method: procrustes

optimization:
  objective_metric: validation/avg_task_performance_epoch
  run_test: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset.shift_strength: 0.0
