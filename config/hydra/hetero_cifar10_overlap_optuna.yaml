defaults:
  - hetero_cifar10_overlap_experiment
  - override hydra/sweeper: optuna
  - _self_

hydra:
  mode: MULTIRUN
  sweeper:
    direction: minimize
    study_name: hetero_cifar10_overlap_sheaf_frl
    n_trials: 24
    n_jobs: 1
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: ${seed}
    params:
      orchestrator.lambda_sheaf: tag(log, interval(1e-3, 0.5))
      orchestrator.anchor_strategy: choice(prototype,random,balanced,semantic_pilots,clustered_pilots,dynamic)
      orchestrator.parseval_normalization: choice(false,true)
      orchestrator.l2_normalization: choice(false,true)
      orchestrator.num_anchors: choice(16,32,64,128,256)
      dataset.shared_classes: choice(2,4,6,8,10)
