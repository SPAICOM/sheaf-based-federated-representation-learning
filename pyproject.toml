[project]
name = "python-repo-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=4.8.3",
    "gdown>=5.0.0",
    "hydra-core>=1.3.2",
    "hydra-optuna-sweeper==1.2.0",
    "kaggle>=2.0.1",
    "lightning>=2.6.1",
    "optuna>=2.10.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.10.0",
    "timm>=1.0.26",
    "torch>=2.10.0",
    "wandb>=0.25.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::UserWarning:lightning.pytorch.core.module",
]

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.ruff.lint]
extend-select = [
    'C4',
    'SIM',
    'UP',
    'TCH',
    'I',
    'NPY',
    'PERF',
    'E',
]
fixable = ['ALL']

[tool.ruff.lint.pydocstyle]
convention = 'numpy'

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]
