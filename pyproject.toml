[project]
name = "python-repo-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.3",
    "hydra-core>=1.3.2",
    "lightning>=2.6.1",
    "torch>=2.10.0",
    "wandb>=0.25.1",
]

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.ruff.lint]
extend-select = [
    'C4',
    'SIM',
    'UP',
    'TCH',
    'I',
    'NPY',
    'PERF',
    'E',
]
fixable = ['ALL']

[tool.ruff.lint.pydocstyle]
convention = 'numpy'

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
